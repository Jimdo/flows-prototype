<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onboarding — Template</title>
<link rel="stylesheet" href="/flows-prototype/design-system/dist/layout.css">
<link rel="stylesheet" href="/flows-prototype/design-system/dist/components.css">
<!-- Baseline tokens (synced from @jimdo/ui) load LAST so upstream wins for
     every redeclared --jui-*. See kb/design-analysis/2026-05-11_jui-token-divergence-decisions.md
     for the 5 truly-divergent tokens we deliberately accepted from upstream. -->
<link rel="stylesheet" href="/flows-prototype/design-system/dist/baseline/jui-tokens.css">
<style>
  /* ─── Screen overrides ───
     The question centres on mobile like every other step, and on desktop it
     reads from the same left edge as the row of layouts under it. Spacing
     and the header come from the single-column setup variant. */

  /* On a tall screen the leftover height was dumped between the cards and
     Continue — at 900 that was a 200px hole. The question keeps the top
     left, where every other step puts it; the row of layouts takes the
     middle of what is left under it. So the carousel grows into the spare
     height and centres its cards inside itself, which measures from below
     the question rather than from the top of the frame — the offset the
     question and its line add is already spent by the time the row starts. */
  @media (min-width: 768px) {
    .template-carousel {
      flex: 1 0 auto;
      align-items: center;
    }
  }

  /* The flow's phone gutter is 16: every step before and after this one
     starts its title there, and this shell's own 12 put the question and the
     row of layouts 4px left of all of them. Set on the column and on the
     scroller's bleed together, so the first card keeps landing on the
     title's left edge. */
  @media (max-width: 767px) {
    .setup-split-fields { padding-left: var(--jui-layout-padding-m); padding-right: var(--jui-layout-padding-m); }
    .setup-split-actions { padding-left: var(--jui-layout-padding-m); padding-right: var(--jui-layout-padding-m); }
  }

  /* ─── Template carousel ─── */
  /* Horizontal snap-scroll with peek of adjacent cards. Selected card gets a
     2px blue outline + soft blue glow shadow; unselected cards carry a neutral
     soft shadow.

     Full-bleed on desktop: the carousel breaks out of content-container's
     768px max-width so it extends edge-to-edge. page-intro above stays
     inside the constrained container. */
  .template-carousel {
    --card-w: 180px;     /* .template-card-inner width */
    --half-card-w: 90px; /* half of it */
    display: flex;
    gap: var(--jui-layout-gap-l);
    overflow-x: auto;
    scroll-snap-type: none;
    scrollbar-width: none;
    padding: var(--jui-layout-padding-l) 0 var(--jui-layout-padding-l);
    margin-bottom: -12px;
    width: 100vw;
    margin-left: calc(50% - 50vw);
    margin-right: calc(50% - 50vw);
    /* Left-aligned at both sizes. Centring the snapped card read well on its
       own and badly beside the title above it, which starts at the column's
       left edge — the chosen layout is the subject of the screen, so it sits
       where reading starts. The scroller still spans the viewport and pads
       itself back to that edge, which keeps the cards already scrolled past
       on screen and clickable in the gutter. */
    --bleed: var(--jui-layout-padding-m);
    padding-left: var(--bleed);
    /* Trailing room so the last layout can still reach the first place. */
    padding-right: calc(100vw - var(--card-w));
    scroll-padding-inline: 0;
  }

  .template-carousel::-webkit-scrollbar { display: none; }

  @media (min-width: 768px) {
    /* A left-aligned row rather than a centred one: the first layout is the
       one being chosen, so it sits where reading starts. It still runs off
       the right edge, which is what says there are more of them. */
    .template-carousel {
      gap: var(--jui-layout-gap-l);
      width: auto;

      /* The distance from the viewport edge to the column's content edge.
         The scroller spans the whole viewport and pads itself back by that
         much, so the first layout still starts on the title's left edge
         while the ones already chosen past stay on screen in the gutter
         rather than disappearing off it — they have to be visible to be
         clickable again. It also gives the selected card's glow room, which
         a scroller would otherwise clip. */
      --bleed: calc(50vw - var(--setup-single-max) / 2 + var(--jui-layout-padding-m));
      margin-left: calc(-1 * var(--bleed));
      padding-left: var(--bleed);
      margin-right: calc(-1 * var(--bleed));
      /* Trailing room so the last layout can still reach the first place.
         Without it the scroller runs out before the later cards get there
         and the selection snaps back to whichever one the end of the scroll
         happened to leave on the left. */
      padding-right: calc(100vw - var(--card-w));
      scroll-padding-inline: 0;
      scroll-snap-type: none;
    }
  }

  .template-card {
    flex: 0 0 auto;
    scroll-snap-align: center;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    border-radius: var(--jui-style-radius-l);
  }

  .template-card:focus-visible {
    outline: 2px solid var(--jui-color-actions-primary-rest);
    outline-offset: 4px;
  }

  .template-card-inner {
    width: 180px;
    aspect-ratio: 585 / 1091;
    border-radius: var(--jui-style-radius-l);
    padding: 0;
    box-shadow: 0 4px 14px 0 rgba(0, 0, 0, 0.10);
    transition: border-radius 150ms ease, box-shadow 150ms ease, transform 200ms ease;
    box-sizing: border-box;
    transform-origin: center center;
  }

  .template-card[aria-checked="true"] .template-card-inner {
    border: 2px solid var(--jui-color-actions-primary-rest);
    border-radius: calc(var(--jui-style-radius-l) + 2px); /* concentric: image radius + border-width */
    box-shadow: 0 5px 16px 0 var(--jui-color-blue-50);
    transform: scale(1.06);
  }

  .template-thumb {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: top;
    border: 1px solid var(--jui-color-gray-100);
    border-radius: var(--jui-style-radius-l);
    box-sizing: border-box;
  }
</style>
</head>
<body>

  <div class="variant active" id="variant-default">
    <div class="app-shell app-shell-setup-split app-shell-setup-single">

  <script>
    var VARIANTS = {
      'default': 'variant-default'
    };
    function showVariant(key) {
      document.querySelectorAll('.variant').forEach(function(v) { v.classList.remove('active'); });
      var target = document.getElementById(VARIANTS[key]);
      if (target) target.classList.add('active');
    }
    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'set-variant' && VARIANTS[e.data.variant]) {
        showVariant(e.data.variant);
      }
    });

    /* ─── Carousel behavior ─── */
    /* Matches loops-frontend TemplateCarousel:
       - click a card → it becomes selected and scroll-snaps to center
       - scroll → auto-select the card closest to viewport center (debounced)
       - Arrow keys / Home / End for keyboard navigation
       - Only the selected card is in the tab order */
    (function(){
      var carousel = document.querySelector('.template-carousel');
      if (!carousel) return;
      var cards = Array.prototype.slice.call(carousel.querySelectorAll('.template-card'));

      function select(card, opts){
        opts = opts || {};
        cards.forEach(function(c){
          var isSel = c === card;
          c.setAttribute('aria-checked', isSel ? 'true' : 'false');
          c.tabIndex = isSel ? 0 : -1;
        });
        if (opts.scroll !== false) {
          // The chosen layout goes to the first place at both sizes, which
          // is where the title above it starts. Mobile used to centre it,
          // leaving the card sitting 78px right of everything else on the
          // screen — the CSS had already been changed to left-align and this
          // had not. Measuring from the first card rather than from the
          // padding keeps it honest if the bleed padding ever changes.
          var target = card.offsetLeft - cards[0].offsetLeft;
          target = Math.max(0, Math.min(carousel.scrollWidth - carousel.clientWidth, target));
          var before = carousel.scrollLeft;
          try {
            carousel.scrollTo({ left: target, behavior: opts.behavior || 'smooth' });
          } catch (e) {
            carousel.scrollLeft = target;
          }
          // Safety: if native scroll was a no-op (headless / hidden tab),
          // force-assign after a tick so the selected card still lands.
          setTimeout(function(){
            if (Math.abs(carousel.scrollLeft - before) < 1 && Math.abs(target - before) > 1) {
              carousel.scrollLeft = target;
            }
          }, 50);
        }
      }

      /* Whichever card is nearest the place a selected card belongs: the
         first place, at both sizes. */
      function closestToAnchor(){
        var rect = carousel.getBoundingClientRect();
        // The first place, in viewport coordinates: the scroller's own left
        // edge plus its bleed padding. Not offset by scrollLeft — the anchor
        // is a fixed spot on screen, and subtracting the scroll made it
        // travel with the content, which dragged the selection back to the
        // first card after every scroll.
        var anchorX = rect.left + cards[0].offsetLeft;
        var best = null, bestDist = Infinity;
        cards.forEach(function(c){
          var d = Math.abs(c.getBoundingClientRect().left - anchorX);
          if (d < bestDist) { bestDist = d; best = c; }
        });
        return best;
      }

      // Click to select
      cards.forEach(function(card){
        card.addEventListener('click', function(){ select(card); });
      });

      // Auto-select on scroll end (debounced)
      var scrollTimer = null;
      carousel.addEventListener('scroll', function(){
        // On a phone the scroll is the gesture that chooses: what you have
        // brought to the first place is what you have picked. On a desktop
        // the row is scanned rather than swiped, so the choice moves on a
        // click and scrolling is just looking.
        if (window.matchMedia('(min-width: 768px)').matches) return;
        if (scrollTimer) clearTimeout(scrollTimer);
        scrollTimer = setTimeout(function(){
          var c = closestToAnchor();
          if (c && c.getAttribute('aria-checked') !== 'true') select(c, { scroll: false });
        }, 120);
      }, { passive: true });

      // Keyboard navigation
      carousel.addEventListener('keydown', function(e){
        var current = cards.find(function(c){ return c.getAttribute('aria-checked') === 'true'; });
        var idx = cards.indexOf(current);
        var next = null;
        if (e.key === 'ArrowRight') next = cards[Math.min(cards.length - 1, idx + 1)];
        else if (e.key === 'ArrowLeft') next = cards[Math.max(0, idx - 1)];
        else if (e.key === 'Home') next = cards[0];
        else if (e.key === 'End') next = cards[cards.length - 1];
        if (next) {
          e.preventDefault();
          select(next);
          // preventScroll: focus() scrolls the element into view by itself,
          // instantly, which lands on top of the smooth scroll select() has
          // just begun — so the keys jumped where a click glided.
          next.focus({ preventScroll: true });
        }
      });

      // Initial: center the selected card (no scroll animation on load)
      var initial = cards.find(function(c){ return c.getAttribute('aria-checked') === 'true'; }) || cards[0];
      // Wait for layout + images so scrollIntoView measures correctly
      window.addEventListener('load', function(){
        select(initial, { behavior: 'instant' });
      });
    })();
  </script>
  <script src="/flows-prototype/design-system/hifi-designs/prototype-nav.js"></script>

</body>
