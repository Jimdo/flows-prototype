  <script type="module">
    import { initSetupSplit } from '/flows-prototype/design-system/hifi-designs/shared/setup-split.js';

    const input    = document.getElementById('nameInput');
    const linkRow  = document.getElementById('linkRow');
    const linkReveal = document.getElementById('linkReveal');
    const linkEdit = document.getElementById('linkEdit');
    const editBtn  = document.getElementById('editLink');
    const handle   = document.getElementById('handleValue');
    const handleEd = document.getElementById('handleEdit');

    // The name is what this step changes, so the page title is what the
    // preview marks. The drawer, the drag and the bridge all come from the
    // shared layout module.
    // The name field carries data-edits="title", so the preview marks the
    // title only while that field is focused. The handle field carries
    // nothing: the address does not appear on the page, so there is nothing
    // honest to point at while it is being edited.
    const shell = document.getElementById('shell');
    const photoBtn = document.getElementById('photoBtn');

    const split = initSetupSplit({
      state: () => ({
        title: input.value || input.placeholder,
        image: shell.getAttribute('data-photo') === 'added' ? 'photo' : 'placeholder',
        // Nothing has been added yet, so the page shows the shape of what
        // is coming rather than a short page that grows a piece at a time.
        contact: [],
        ghost: ['subtitle', 'contact', 'mainlink', 'map', 'socials'],
      }),
    });

    function slugify(s) {
      return String(s || '')
        .toLowerCase()
        .normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]+/g, '')
        .slice(0, 30);
    }

    // ─── Link ───
    // The handle follows the name until the user edits it, which is why this
    // step absorbed the old URL step: there is nothing left to ask that the
    // name has not already answered.
    let handleEdited = false;

    // The address follows the name. With no name it shows the shape of one
    // rather than disappearing, so the step opens complete.
    function syncLink() {
      const named = input.value.trim().length > 0;
      linkReveal.setAttribute('data-shown', named ? 'true' : 'false');
      if (named) settleWhenOpen();
      linkRow.setAttribute('data-filled', named ? 'true' : 'false');
      // Clearing the name closes an open editor on the way out, so the row
      // does not come back mid-edit the next time a name is typed.
      if (!named) {
        linkRow.setAttribute('data-link', 'read');
        handleEdited = false;
      }
      // Clipped again the moment it starts closing, so the shrink reads as a
      // reveal in reverse rather than the content vanishing all at once.
      if (!named) linkReveal.classList.remove('is-settled');
      if (handleEdited) return;
      const derived = slugify(input.value);
      handle.textContent = derived;
      handleEd.textContent = derived;
      syncDomain();
      if (named) check();
    }

    // ─── The other address ───
    // The domain follows whatever the address shows, so the two read as the
    // same name twice rather than two unrelated strings. The dialog carries
    // the same value, because a dialog that renamed it would be about a
    // different domain than the row that opened it.
    const domainOffer = document.getElementById('domainOffer');
    const domainValue = document.getElementById('domainOfferValue');
    const domainName  = document.getElementById('domainSheetName');
    const domainSheet = document.getElementById('domainSheet');

    function syncDomain() {
      const value = (handle.textContent || 'yourname') + '.com';
      domainValue.textContent = value;
      domainName.textContent = value;
    }

    // ─── Checking ───
    // What the live step does (loops-frontend useLinkAvailability.ts): the
    // typed value is debounced by AVAILABILITY_DEBOUNCE_MS, then a suggest
    // call and a check call run against domains-backend, and `available` is
    // held at undefined for the whole of it — so a tick is never shown for a
    // name nobody has checked. Both addresses go through it: the jim.do one
    // via check-jimdo-short-subdomain, the custom one via the domain
    // suggestions endpoint. Here the two calls are a timer; the states, the
    // debounce and the order they settle in are the real ones.
    const CHECK_DEBOUNCE_MS = 400;   // AVAILABILITY_DEBOUNCE_MS
    const CHECK_REQUEST_MS  = 450;   // suggest + check, standing in for the network
    let checkTimer;

    function check() {
      linkRow.setAttribute('data-state', 'checking');
      domainOffer.setAttribute('data-state', 'checking');
      clearTimeout(checkTimer);
      checkTimer = setTimeout(() => {
        linkRow.setAttribute('data-state', 'ready');
        domainOffer.setAttribute('data-state', 'ready');
      }, CHECK_DEBOUNCE_MS + CHECK_REQUEST_MS);
    }

    function closeDomain() { domainSheet.setAttribute('data-open', 'false'); }

    domainOffer.addEventListener('click', () => {
      domainSheet.setAttribute('data-open', 'true');
    });
    document.getElementById('domainLater').addEventListener('click', closeDomain);
    domainSheet.addEventListener('click', (e) => {
      if (e.target === domainSheet) closeDomain();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeDomain();
    });

    function caretToEnd(el) {
      el.focus();
      const range = document.createRange();
      range.selectNodeContents(el);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }

    input.addEventListener('input', () => { syncLink(); split.sync(); });

    // Once open, the reveal stops clipping so the field inside can show its
    // focus ring. transitionend is the accurate signal; the timeout is the
    // backstop for when transitions are off and it never fires.
    let settleTimer = null;
    function settleWhenOpen() {
      window.clearTimeout(settleTimer);
      if (linkReveal.getAttribute('data-shown') !== 'true') return;
      settleTimer = window.setTimeout(() => linkReveal.classList.add('is-settled'), 320);
    }
    linkReveal.addEventListener('transitionend', (e) => {
      if (e.propertyName !== 'grid-template-rows') return;
      if (linkReveal.getAttribute('data-shown') === 'true') linkReveal.classList.add('is-settled');
    });

    photoBtn.addEventListener('click', () => {
      shell.setAttribute('data-photo', shell.getAttribute('data-photo') === 'added' ? 'empty' : 'added');
      split.sync();
    });

    editBtn.addEventListener('click', () => {
      linkRow.setAttribute('data-link', 'edit');
      // The edit field plus its hint is taller than the resting drawer, so
      // on mobile the drawer lifts while the handle is being chosen.
      split.setState('expanded');
      caretToEnd(handleEd);
    });

    // Clicking the field anywhere puts the caret at the end of the handle,
    // never inside the fixed suffix.
    linkEdit.addEventListener('mousedown', (e) => {
      if (e.target === handleEd) return;
      e.preventDefault();
      caretToEnd(handleEd);
    });

    handleEd.addEventListener('input', () => {
      handleEdited = true;
      const typed = slugify(handleEd.textContent);
      handle.textContent = typed || slugify(input.value);
      syncDomain();
      check();
      linkRow.setAttribute('data-filled', typed ? 'true' : 'false');
    });

    handleEd.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); handleEd.blur(); }
    });

    handleEd.addEventListener('blur', () => {
      const cleaned = slugify(handleEd.textContent);
      // An emptied handle goes back to following the name rather than
      // sticking as a blank the user cannot recover from.
      if (!cleaned) handleEdited = false;
      handleEd.textContent = cleaned || slugify(input.value);
      handle.textContent = handleEd.textContent;
      linkRow.setAttribute('data-filled', handleEd.textContent ? 'true' : 'false');
      linkRow.setAttribute('data-link', 'read');
      split.setState('default');
    });

    // ─── Workbench variants ───
    const VARIANTS = {
      'drawer-open':      { drawer: 'default',   value: '',                 link: 'read', focus: null },
      'editing-the-name': { drawer: 'default',   value: 'Ann Weber Studio', link: 'read', focus: input },
      'editing-the-link': { drawer: 'expanded',  value: 'Ann Weber Studio', link: 'edit', focus: handleEd },
      'drawer-expanded':  { drawer: 'expanded',  value: 'Ann Weber Studio', link: 'read', focus: null },
      'preview-peek':     { drawer: 'collapsed', value: 'Ann Weber Studio', link: 'read', focus: null },
    };

    window.addEventListener('message', (e) => {
      if (!e.data || e.data.type !== 'set-variant') return;
      const v = VARIANTS[e.data.variant];
      if (!v) return;
      handleEdited = false;
      input.value = v.value;
      syncLink();
      if (v.value) linkRow.setAttribute('data-link', v.link);
      split.setState(v.drawer);
      if (v.focus) v.focus.focus(); else if (document.activeElement) document.activeElement.blur();
      split.sync();
    });

    syncLink();
  </script>

</body>
</html>
