<!-- Baseline tokens (synced from @jimdo/ui) load LAST so upstream wins for
     every redeclared --jui-*. See kb/design-analysis/2026-05-11_jui-token-divergence-decisions.md
     for the 5 truly-divergent tokens we deliberately accepted from upstream. -->
<link rel="stylesheet" href="/flows-prototype/design-system/dist/baseline/jui-tokens.css?v=088d811">
<style>
  /* ─── Screen overrides ───
     This step asks a question with three answers and then shows what the
     answer lands next to, so it rests taller than a step holding one field:
     the three offers and the first contact button are visible before any
     scrolling.

     The drawer also holds two views — the step itself, and the list of what
     else can go on the page. The Add button swaps the view rather than
     opening a sheet over it, so on a phone there is one surface, not one
     stacked on another. */
  .app-shell-setup-split { --setup-drawer-rest-h: 420px; }

  #shell[data-view="step"] [data-view-only="add"],
  #shell[data-view="add"] [data-view-only="step"] { display: none; }

  /* Name and tag on one line: the tag is a qualifier on the name, not a
     second fact under it, and three stacked tags cost a card's worth of
     height in a panel that has to hold the fields too. */
  .offer-head {
    display: flex;
    align-items: center;
    gap: var(--jui-layout-gap-xs);
    flex-wrap: wrap;
  }

  /* Which piece an offer builds — a booking or a form. The names above are
     the seller's words for what they sell; this says what it becomes. */
  .offer-kind {
    padding: 0 var(--jui-layout-padding-xxs);
    border-radius: var(--jui-style-radius-4);
    background: var(--jui-color-background-gray-canvas);
    color: var(--jui-color-typography-gray-on-light-subdued);
    font-size: var(--jui-typography-label-small-size);
    font-weight: var(--jui-typography-label-small-weight);
    line-height: var(--jui-typography-label-small-lh);
    letter-spacing: var(--jui-typography-label-small-ls);
    text-transform: uppercase;
  }

  /* One reason over both suggestions: they are two halves of the same
     answer, not two offers competing, so the case is made once above them
     rather than argued on each card. */
  .offer-why {
    margin: 0;
    font-size: var(--jui-typography-body-small-regular-size);
    font-weight: var(--jui-typography-body-small-regular-weight);
    line-height: var(--jui-typography-body-small-regular-lh);
    color: var(--jui-color-typography-gray-on-light-subdued);
  }

  /* The offers and the plain link are the same kind of thing — one button on
     the page — so they share a label and sit at one rhythm inside it. */
  .field-group--mainlinks { gap: var(--jui-layout-gap-s); }

  /* Already on the page. Kept in the list rather than removed: a list that
     changes length while you read it is harder to come back to than one
     that greys out what is done. */
  .add-option:disabled {
    background: var(--jui-color-background-gray-canvas);
    border-color: var(--jui-color-stroke-gray-decorative);
    cursor: default;
  }
  .add-option:disabled .add-option-title,
  .add-option:disabled .add-option-detail,
  .add-option:disabled .add-option-icon { color: var(--jui-color-typography-gray-on-light-subdued); }

  .field-group[hidden], .field-row[hidden] { display: none; }
</style>

            data-inspect-phrase="questionaire.cta"
            data-trigger="primary-cta"
            data-nav-to="flows/onboarding-handoff.html"
            data-nav-screen-id="scr-470">Continue</button>
        </div>

        <div class="setup-split-actions" data-view-only="add">
          <button class="btn btn-secondary" id="addBack" data-inspect-phrase="">Back</button>
        </div>

      </div>
    </div>
  </div>

  <script type="module" src="/flows-prototype/design-system/hifi-designs/shared/business-entity.js?v=088d811"></script>
  <script src="/flows-prototype/design-system/hifi-designs/prototype-nav.js?v=088d811"></script>
  <script type="module">
    import { initSetupSplit } from '/flows-prototype/design-system/hifi-designs/shared/setup-split.js';

    const shell   = document.getElementById('shell');
    const list    = document.getElementById('offerList');
    const cards   = Array.from(list.querySelectorAll('.select-card'));
    const addBtn  = document.getElementById('addBtn');
    const addBack = document.getElementById('addBack');

    const fMain     = document.getElementById('fMain');
    const fEmail    = document.getElementById('fEmail');
    const fWhatsapp = document.getElementById('fWhatsapp');
    const fCall     = document.getElementById('fCall');
    const fSocial   = document.getElementById('fSocial');
    const fAddress  = document.getElementById('fAddress');

    // What each thing in the add list turns on: the row it reveals, the group
    // that row lives in, and the field that then wants the cursor. The main
    // link and the first contact button are on from the start, so adding them
    // is only ever a way back to a field already there.
    const ADDS = {
      whatsapp: { row: 'rowWhatsapp', group: 'groupContact', field: fWhatsapp, on: false },
      email:    { row: 'rowEmail',    group: 'groupContact', field: fEmail,    on: true  },
      call:     { row: 'rowCall',     group: 'groupContact', field: fCall,     on: false },
      mainlink: { row: null,          group: null,           field: fMain,     on: true  },
      socials:  { row: 'rowSocial',   group: 'groupSocial',  field: fSocial,   on: false },
      address:  { row: 'rowAddress',  group: 'groupPlace',   field: fAddress,  on: false },
    };

    const options = Array.from(document.querySelectorAll('.add-option[data-add]'));

    const split = initSetupSplit({
      state: () => {
        const card = cards.find((c) => c.getAttribute('aria-checked') === 'true');
        const main = fMain.value.trim();
        const hasContact = !!(fEmail.value.trim() || fWhatsapp.value.trim() || fCall.value.trim());
        const hasMap = ADDS.address.on && !!fAddress.value.trim();
        const hasSocial = ADDS.socials.on && !!fSocial.value.trim();
        return {
          title: 'Clara and Stone',
          subtitle: 'Yoga and mindfulness workshops for women',
          image: 'photo',
          // A contact button exists once there is something behind it, so the
          // page shows what has been filled in rather than a row of buttons
          // that do nothing.
          contact: [
            { id: 'whatsapp', on: !!fWhatsapp.value.trim() },
            { id: 'email',    on: !!fEmail.value.trim() },
            { id: 'call',     on: !!fCall.value.trim() },
          ],
          // Each piece puts a differently shaped card on the page: a dated
          // booking carries a calendar and a date, a form carries neither.
          offer: card ? {
            on: true,
            kind: card.getAttribute('data-kind'),
            title: card.getAttribute('data-title'),
            meta: card.getAttribute('data-meta'),
            cta: card.getAttribute('data-cta'),
            price: card.getAttribute('data-price'),
          } : { on: false },
          // Sent after the offer on purpose: the artifact clears the link
          // block when an offer is on, and this step has both.
          links: main ? 'default' : 'none',
          mainlink: main,
          address: { on: hasMap, value: fAddress.value.trim() },
          // What is still empty keeps standing in as a shape, so the page is
          // visibly answering the question rather than appearing afterwards.
          ghost: [
            ...(hasContact ? [] : ['contact']),
            ...(main ? [] : ['mainlink']),
            ...(ADDS.address.on && !hasMap ? ['map'] : []),
            ...(hasSocial ? [] : ['socials']),
          ],
        };
      },
    });

    /* ── The two views ──
       Add swaps what the drawer holds. One surface on a phone: a sheet over
       a sheet is two things to dismiss and hides the page they are both
       about. */
    function setView(name) {
      shell.setAttribute('data-view', name);
      const fields = shell.querySelector('.setup-split-fields');
      if (fields) fields.scrollTop = 0;
      if (name === 'add' && shell.getAttribute('data-drawer') === 'collapsed') split.setState('default');
    }

    function syncOptions() {
      options.forEach((opt) => {
        const added = ADDS[opt.getAttribute('data-add')].on;
        opt.disabled = added;
        const detail = opt.querySelector('.add-option-detail');
        if (added) {
          if (!opt.dataset.detail) opt.dataset.detail = detail.textContent;
          detail.textContent = 'Already on your page';
        } else if (opt.dataset.detail) {
          detail.textContent = opt.dataset.detail;
        }
      });
    }

    function add(key) {
      const item = ADDS[key];
      item.on = true;
      if (item.row) document.getElementById(item.row).hidden = false;
      if (item.group) document.getElementById(item.group).hidden = false;
      syncOptions();
      setView('step');
      // Land on the field that was just asked for, so the thing added is the
      // thing being filled in — and the preview marks where it goes.
      if (item.field) item.field.focus();
      split.sync();
    }

    options.forEach((opt) => opt.addEventListener('click', () => add(opt.getAttribute('data-add'))));
    addBtn.addEventListener('click', () => setView('add'));
    addBack.addEventListener('click', () => setView('step'));

    [fMain, fEmail, fWhatsapp, fCall, fSocial, fAddress]
      .forEach((f) => f.addEventListener('input', split.sync));

    cards.forEach((card) => {
      card.addEventListener('click', () => {
        cards.forEach((c) => c.setAttribute('aria-checked', String(c === card)));
        card.focus();
        split.sync();
      });
    });

    const VARIANTS = {
      'empty':           { view: 'step', drawer: 'default',   offer: 'event', adds: [],                       focus: null },
      'form-offer':      { view: 'step', drawer: 'default',   offer: 'form',  adds: [],                       focus: null },
      'add-open':        { view: 'add',  drawer: 'default',   offer: 'event', adds: [],                       focus: null },
      'everything-on':   { view: 'step', drawer: 'expanded',  offer: 'event', adds: ['whatsapp', 'socials', 'address'], focus: null },
      'preview-peek':    { view: 'step', drawer: 'collapsed', offer: 'event', adds: ['whatsapp'],             focus: null },
    };

    const SAMPLE = {
      whatsapp: '+49 170 1234567',
      call: '+49 211 4567890',
      socials: 'instagram.com/claraandstone',
      address: 'Oststraße 12, Düsseldorf',
    };

    window.addEventListener('message', (e) => {
      if (!e.data || e.data.type !== 'set-variant') return;
      const v = VARIANTS[e.data.variant];
      if (!v) return;
      fMain.value = 'claraandstone.com';
      v.adds.forEach((key) => {
        const item = ADDS[key];
        item.on = true;
        if (item.row) document.getElementById(item.row).hidden = false;
        if (item.group) document.getElementById(item.group).hidden = false;
        if (item.field && SAMPLE[key]) item.field.value = SAMPLE[key];
      });
      syncOptions();
      cards.forEach((c) => c.setAttribute('aria-checked', String(c.getAttribute('data-offer') === v.offer)));
      setView(v.view);
      split.setState(v.drawer);
      if (document.activeElement) document.activeElement.blur();
      split.sync();
    });

    syncOptions();
  </script>

</body>
