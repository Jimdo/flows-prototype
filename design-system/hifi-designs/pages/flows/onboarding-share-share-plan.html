<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bio Page — Ready, share-plan proposal</title>
<link rel="stylesheet" href="/flows-prototype/design-system/dist/layout.css?v=d2465da">
<link rel="stylesheet" href="/flows-prototype/design-system/dist/components.css?v=d2465da">
<!-- Baseline tokens (synced from @jimdo/ui) load LAST so upstream wins for
     every redeclared --jui-*. See kb/design-analysis/2026-05-11_jui-token-divergence-decisions.md
     for the 5 truly-divergent tokens we deliberately accepted from upstream. -->
<link rel="stylesheet" href="/flows-prototype/design-system/dist/baseline/jui-tokens.css?v=d2465da">
<style>

  /* ═══════════════════════════════════════════════════════════════
     BIO PAGE — READY, SHARE-PLAN PROPOSAL  (scr-476, vision)
     Figma: 2LVaYKcyyN2F2MUwSssFrL 11540:39873 (Menu 11540:39968,
     IGBioBlock 11540:39408). The bio frame as drawn, kept apart from
     scr-030 because prod diverges on four points: headline copy, the
     missing subheading, the social card's chrome, and a CTA that leads
     to a share plan instead of back to the dashboard.
     ═══════════════════════════════════════════════════════════════ */

  [hidden] { display: none !important; }

  html, body { height: 100%; }
  body, .app-shell { background: var(--jui-color-background-gray-light); }

  /* ═══════════════════════════════════════════════
     SHELL — loops-frontend pages/Success/SuccessScreen.tsx
     .container  → FlexBox bg gray-light, margin-inline auto,
                   paddingBlock l (24), paddingInline m (16)
     .content    → flex 1, clears the fixed mobile CTA bar
     .twoColumn  → column → row from sm (576); card chrome from md (768)
     ═══════════════════════════════════════════════ */
  .success-container {
    position: relative;
    width: 100%;
    overflow: hidden;
    margin-inline: auto;
    padding-block: var(--jui-layout-padding-l);     /* 24 */
    padding-inline: var(--jui-layout-padding-m);    /* 16 */
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  @media (min-width: 768px) {
    .success-container { max-width: min(1200px, 90vw); overflow: hidden; }
  }

  .success-content {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    /* gap-xxl (80) + gap-l (24) — clears the fixed CTA bar on mobile */
    padding-bottom: calc(var(--jui-layout-gap-xxl) + var(--jui-layout-gap-l) + env(safe-area-inset-bottom));
  }
  @media (min-width: 768px) {
    .success-content {
      justify-content: center;
      padding-bottom: var(--jui-layout-padding-zero);
    }
  }

  .success-layout {
    position: relative;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--jui-layout-gap-l);                   /* 24 — mobile stack */
  }
  @media (min-width: 576px) {
    .success-layout {
      flex-direction: row;
      align-items: stretch;
      gap: var(--jui-layout-gap-zero);
    }
  }
  @media (min-width: 768px) {
    .success-layout { flex: 1; }
  }

  /* ═══════════════════════════════════════════════
     TITLE BLOCK — rendered twice (SuccessScreen.tsx TitleBlock):
     above the stack on mobile, inside the card from md up.
     headlineSmall = 400 / lh 125% / ls -0.02em, 32 → 28 ≤1200 → 24 ≤576.
     ═══════════════════════════════════════════════ */
  .success-title {
    display: flex;
    width: 100%;
    flex-direction: column;
    gap: var(--jui-layout-gap-xs);                  /* 8 */
  }
  .success-title--card { display: none; }
  @media (min-width: 768px) {
    .success-title--mobile { display: none; }
    .success-title--card { display: flex; }
  }
  .success-headline {
    margin: 0;
    font-family: inherit;
    font-size: 32px;
    font-weight: 400;
    line-height: 1.25;
    letter-spacing: -0.02em;
    color: var(--jui-color-typography-gray-on-light-default);
    text-align: center;
  }
  @media (max-width: 1200px) { .success-headline { font-size: 28px; } }
  @media (max-width: 576px)  { .success-headline { font-size: 24px; } }
  .success-subtitle {
    margin: 0;
    font-size: var(--jui-typography-body-medium-regular-size);
    font-weight: var(--jui-typography-body-medium-regular-weight);
    line-height: var(--jui-typography-body-medium-regular-lh);
    color: var(--jui-color-typography-gray-on-light-default);
    text-align: center;
  }

  /* ═══════════════════════════════════════════════
     PREVIEW COLUMN — PreviewBlob + Confetti + PhoneFrame.
     Phone is a chrome-less clipped frame (radius-xl, shadow lvl-3);
     the 360×713 artifact is scaled to fit by .phone-scaler.
     ═══════════════════════════════════════════════ */
  .preview-column {
    position: relative;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  @media (min-width: 768px) { .preview-column { flex: 1 1 0; } }

  .preview-blob {
    position: absolute;
    z-index: 0;
    top: 50%;
    left: 50%;
    width: 288px;                                   /* 180 × 1.6 */
    aspect-ratio: 334.632 / 331.763;
    transform: translate(-50%, -50%) rotate(15deg);
    pointer-events: none;
  }
  .preview-blob svg { display: block; width: 100%; height: 100%; }
  @media (min-width: 576px) { .preview-blob { width: 432px; } }        /* 270 × 1.6 */
  @media (min-width: 768px) { .preview-blob { width: 480px; max-width: 100%; } }

  .phone-stage {
    position: relative;
    z-index: 1;
    width: 100%;
    display: flex;
    justify-content: center;
  }

  .phone-frame {
    position: relative;
    z-index: 2;
    box-sizing: border-box;
    width: 180px;
    aspect-ratio: 360 / 713;
    flex-shrink: 0;
    overflow: hidden;
    border-radius: var(--jui-style-radius-xl);      /* 20 */
    box-shadow: var(--jui-effects-on-light-shadow-lvl-3);
    background: var(--jui-color-background-gray-light);
  }
  @media (min-width: 576px) { .phone-frame { width: 270px; } }
  @media (min-width: 768px) {
    .phone-frame {
      width: auto;
      height: min(600px, calc(100dvh - 120px));
      min-height: 480px;
      max-width: 100%;
    }
  }

  /* PhoneScaler — the artifact renders at its native 360×713 and is
     scaled to the frame (loops-frontend PagePreviewFrame.module.scss). */
  .phone-scaler {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 360px;
    height: 713px;
    transform-origin: center center;
    transform: translate(-50%, -50%) scale(var(--phone-scale, 0.5));
  }
  .phone-scaler iframe { width: 100%; height: 100%; border: 0; display: block; }

  /* ═══════════════════════════════════════════════
     CONFETTI — loops-frontend components/Confetti/Confetti.tsx.
     45 seeded-random dots; burst plays once; reduced-motion shows
     a static scatter.
     ═══════════════════════════════════════════════ */
  .confetti {
    position: absolute;
    top: 0;
    left: 50%;
    height: 0;
    overflow: visible;
    pointer-events: none;
    z-index: 10;
  }
  .confetti-x {
    position: absolute;
    left: var(--dot-left);
    top: 0;
    animation: confetti-x var(--dot-duration) var(--dot-delay) cubic-bezier(0, 0.9, 0.4, 1) forwards;
  }
  .confetti-y {
    animation: confetti-y var(--dot-duration) var(--dot-delay) ease-in-out forwards;
  }
  .confetti-dot {
    width: var(--dot-size);
    height: var(--dot-size);
    border-radius: 50%;
    background-color: var(--dot-color);
    opacity: 0;
    animation: confetti-fade var(--dot-duration) var(--dot-delay) linear forwards;
  }
  @keyframes confetti-x {
    0%   { transform: translateX(0); }
    100% { transform: translateX(var(--dot-x-drift)); }
  }
  @keyframes confetti-y {
    0%   { transform: translateY(0); }
    20%  { transform: translateY(var(--dot-y-peak)); }
    100% { transform: translateY(var(--dot-y-end)); }
  }
  @keyframes confetti-fade {
    0%   { opacity: 0;    transform: rotate(0deg) scaleX(1); }
    6%   { opacity: 0.9; }
    25%  { transform: rotate(calc(var(--dot-rotate) * 0.3)) scaleX(-1); }
    50%  { opacity: 0.85; transform: rotate(calc(var(--dot-rotate) * 0.6)) scaleX(1); }
    75%  { opacity: 0.7;  transform: rotate(calc(var(--dot-rotate) * 0.8)) scaleX(-1); }
    90%  { opacity: 0.3; }
    100% { opacity: 0;    transform: rotate(var(--dot-rotate)) scaleX(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .confetti-x, .confetti-y { animation: none; }
    .confetti-dot { animation: none; opacity: 0.6; }
  }

  /* ═══════════════════════════════════════════════
     MENU CARD — full-bleed on mobile, card chrome from md up.
     ═══════════════════════════════════════════════ */
  .menu-card {
    width: 100%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: var(--jui-color-background-gray-light);
  }
  @media (min-width: 768px) {
    .menu-card {
      flex: 1 1 0;
      border: 1px solid var(--jui-color-stroke-gray-decorative);  /* #f8f8f8 */
      border-radius: var(--jui-style-radius-16);
      padding-block: var(--jui-layout-padding-l);                 /* 24 */
      padding-inline: var(--jui-layout-padding-m);                /* 16 */
    }
  }
  .card-content {
    display: flex;
    flex-direction: column;
    gap: var(--jui-layout-gap-l);                   /* 24 */
    margin-block: auto;
  }

  /* CTA bar — fixed footer on mobile, static in-card from md up. */
  .cta-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    display: flex;
    justify-content: flex-end;
    padding: var(--jui-layout-padding-m);
    padding-bottom: calc(var(--jui-layout-padding-m) + env(safe-area-inset-bottom));
    background: var(--jui-color-background-gray-light);
  }
  @media (min-width: 768px) {
    .cta-bar {
      position: static;
      margin-top: var(--jui-layout-gap-l);          /* 24 */
      padding: var(--jui-layout-padding-zero);
      background: transparent;
    }
  }
  @media (min-width: 768px) {
    /* .btn-primary is full-width by default; from md the CTA hugs its
       label with the @jimdo/ui medium gutter (24px inline). */
    /* primitive-override */
    .cta-bar .btn-primary { width: auto; padding-inline: var(--jui-layout-padding-l); }
  }

  /* ═══════════════════════════════════════════════
     QR BLOCK — SuccessShareBlock.module.scss
     White, gray-default border, radius-l (16), padding 8, gap 12.
     ═══════════════════════════════════════════════ */
  .qr-block {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: var(--jui-layout-gap-s);                   /* 12 */
    background: var(--jui-color-background-gray-light);
    border: 1px solid var(--jui-color-stroke-gray-default);   /* #e6e6e6 */
    border-radius: var(--jui-style-radius-l);                 /* 16 */
    padding: var(--jui-layout-padding-xs);                    /* 8 */
  }
  .qr-code-wrapper { position: relative; width: 100%; display: flex; flex-direction: column; align-items: center; }
  .qr-canvas { display: block; width: 110px; height: 110px; margin: 0 auto; }
  .qr-download-btn {
    position: absolute;
    top: var(--jui-layout-padding-xxs);             /* 4 */
    right: var(--jui-layout-padding-xxs);
    width: var(--jui-layout-dimension-s);           /* 32 */
    height: var(--jui-layout-dimension-s);
    border-radius: var(--jui-style-radius-s);       /* 8 */
    border: none;
    background: transparent;
    color: var(--jui-color-actions-primary-rest);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background-color 150ms ease;
  }
  .qr-download-btn:hover { background: var(--jui-color-actions-static-hover); }
  .qr-download-btn:focus-visible { outline: 2px solid var(--jui-color-actions-primary-rest); outline-offset: 2px; }
  .qr-download-btn svg { width: 24px; height: 24px; }

  .url-row {
    width: 100%;
    display: flex;
    align-items: center;
    gap: var(--jui-layout-gap-s);                   /* 12 */
    background: var(--jui-color-background-gray-dark);        /* gray-50 */
    border-radius: var(--jui-style-radius-l);                 /* 16 */
    padding: var(--jui-layout-padding-xxs)
             var(--jui-layout-padding-xs)
             var(--jui-layout-padding-xxs)
             var(--jui-layout-padding-s);                     /* 4 8 4 12 */
  }
  .url-icon {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    color: var(--jui-color-typography-gray-on-light-default);
    display: flex;
  }
  .url-icon svg { width: 100%; height: 100%; }
  .url-text {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    text-decoration: none;
    color: var(--jui-color-typography-gray-on-light-default);
    font-size: var(--jui-typography-body-small-medium-size);  /* Link/Small 14 */
    font-weight: var(--jui-typography-body-small-medium-weight);
    line-height: var(--jui-typography-body-small-medium-lh);
    letter-spacing: var(--jui-typography-link-small-ls);
    cursor: pointer;
    background: none;
    border: none;
    text-align: left;
    font-family: inherit;
  }
  .url-text:hover { text-decoration: underline; }
  .url-text:focus-visible { outline: 2px solid var(--jui-color-actions-primary-rest); outline-offset: 2px; border-radius: var(--jui-style-radius-s); }

  /* ═══════════════════════════════════════════════
     SOCIAL ROW — SuccessShareBlock.module.scss .socialRow
     288px wide, centred; 4 outlined circular buttons spread evenly.
     ═══════════════════════════════════════════════ */
  .social-row {
    width: 288px;
    max-width: 100%;
    margin-inline: auto;
  }
  .social-share-row {
    width: 100%;
    display: flex;
    justify-content: space-between;
  }
  .social-share-cell { flex: 1; display: flex; justify-content: center; }
  .social-share-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    /* 16 padding + 16 icon + 1px border = 50 on each axis. Figma states
       48 (11540:39999) because its stroke sits inside the frame; prod
       (FlowCard styles.module.scss .socialShareBtn) renders 50 for the
       same reason this does. Prod wins — the 2px is a Figma/code delta,
       not a transcription slip. */
    padding: var(--jui-layout-padding-m);           /* 16 */
    border-radius: 50%;
    border: 1px solid var(--jui-color-stroke-primary-on-light);  /* blue-100 */
    background: var(--jui-color-background-gray-light);
    color: var(--jui-color-actions-primary-rest);
    cursor: pointer;
    transition: background-color 150ms ease, transform 100ms ease;
  }
  .social-share-btn:hover  { background: var(--jui-color-background-primary-light); }
  .social-share-btn:active { background: var(--jui-color-background-primary-light); transform: scale(0.95); }
  .social-share-btn:focus-visible { outline: 2px solid var(--jui-color-actions-primary-rest); outline-offset: 2px; }
  .social-share-btn svg { width: 16px; height: 16px; display: block; }

  /* ═══════════════════════════════════════════════
     TOAST
     ═══════════════════════════════════════════════ */
  .toast-container {
    position: fixed;
    top: var(--jui-layout-dimension-l);
    left: var(--jui-layout-padding-m);
    right: var(--jui-layout-padding-m);
    z-index: 2000;
    pointer-events: none;
  }
  @media (min-width: 768px) {
    .toast-container { left: auto; right: var(--jui-layout-padding-l); width: 280px; }
  }

  /* ═══════════════════════════════════════════════
     SOCIAL FRAME — loops-frontend components/SocialFrame.
     White card, blue-tinted elevation, radius 16, padding 16, gap 8.
     Skeleton Instagram profile row + the "put your link in bio" pill.
     ═══════════════════════════════════════════════ */
  .social-frame {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: var(--jui-layout-gap-xs);                  /* 8 */
    background: var(--jui-color-background-gray-light);
    padding: var(--jui-layout-padding-m);           /* 16 */
    border-radius: var(--jui-style-radius-16);      /* 16 */
    box-shadow: var(--jui-effects-elevation-blue-sm);
  }
  .bio-preview-row {
    display: flex;
    align-items: center;
    gap: var(--jui-layout-gap-m);                   /* 16 */
    padding: var(--jui-layout-padding-xs);          /* 8 */
  }
  /* primitive-override: the shared .story-avatar inner is blue-50; prod
     (SocialFrame/styles.module.scss) fills it background-primary-light. */
  .bio-preview-row .story-avatar-inner { background: var(--jui-color-background-primary-light); }
  .bio-tabs {
    flex: 1;
    min-width: 0;
    display: flex;
    gap: var(--jui-layout-gap-l);                   /* 24 */
    padding: 0 var(--jui-layout-padding-s);         /* 0 12 */
  }
  .bio-tab {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: var(--jui-layout-gap-xxs);                 /* 4 */
  }
  .bio-tab-label   { width: 20px; height: 12px; border-radius: 9999px; background: var(--jui-color-stroke-gray-decorative); }
  .bio-tab-content { width: 100%; height: 8px;  border-radius: 9999px; background: var(--jui-color-stroke-gray-decorative); }

  .share-link-pill {
    width: 100%;
    display: flex;
    align-items: center;
    gap: var(--jui-layout-gap-s);                   /* 12 */
    background: var(--jui-color-background-gray-light);
    border-radius: 9999px;
    padding: var(--jui-layout-padding-xxs) var(--jui-layout-padding-s);  /* 4 12 */
    color: var(--jui-color-actions-primary-rest);
    text-decoration: none;
    cursor: pointer;
    border: none;
    font-family: inherit;
    transition: background-color 150ms ease;
  }
  .share-link-pill:visited { color: var(--jui-color-actions-primary-rest); }
  .share-link-pill:hover,
  .share-link-pill:focus-visible { background: var(--jui-color-background-primary-light); }
  .share-link-pill-label {
    flex: 1;
    min-width: 0;
    text-align: start;
    font-size: var(--jui-typography-body-small-medium-size);
    font-weight: var(--jui-typography-body-small-medium-weight);
    line-height: var(--jui-typography-body-small-medium-lh);
  }
  .share-link-pill svg { width: 16px; height: 16px; flex-shrink: 0; }

  /* ═══════════════════════════════════════════════
     FIGMA QRBlock (11540:39994) — the proposal packs the QR card
     tighter than prod: 8px between the QR and the link row (layout/base,
     not gap-s) and an 8px vertical inset on the link row so the inline
     Share button clears its 32px height.
     ═══════════════════════════════════════════════ */
  .qr-block--figma { gap: var(--jui-layout-gap-xs); }          /* 8 — layout/base */
  .qr-block--figma .url-row {
    padding: var(--jui-layout-padding-xs)
             var(--jui-layout-padding-xs)
             var(--jui-layout-padding-xs)
             var(--jui-layout-padding-s);                      /* 8 8 8 12 */
    gap: var(--jui-layout-gap-xs);                             /* 8 */
  }

  /* ═══════════════════════════════════════════════
     FIGMA IGBioBlock (11540:39408) — the proposal's variant of the
     social frame: bordered instead of elevated, 8px padding, 16px gap,
     and a blue-10 prompt row at radius-l instead of a white pill.
     Overrides sit on .social-frame--figma so the prod rules above stay
     the single definition of the shipped card.
     ═══════════════════════════════════════════════ */
  .social-frame--figma {
    box-shadow: none;
    border: 1px solid var(--jui-color-stroke-gray-default);   /* #e6e6e6 */
    border-radius: var(--jui-style-radius-l);                 /* 16 */
    padding: var(--jui-layout-padding-xs);                    /* 8 */
    gap: var(--jui-layout-gap-m);                             /* 16 */
    align-items: center;
  }
  .social-frame--figma .bio-tabs {
    gap: var(--jui-layout-gap-xl);                  /* 40 — Figma 48 is off our gap scale */
  }
  .social-frame--figma .bio-tab-label   { width: 32px; height: 12px; border-radius: var(--jui-style-radius-24); }
  .social-frame--figma .bio-tab-content { width: 80px; max-width: 100%; height: 8px; border-radius: var(--jui-style-radius-24); }
  .social-frame--figma .share-link-pill {
    background: var(--jui-color-background-primary-light);    /* blue-10 */
    border-radius: var(--jui-style-radius-l);                 /* 16 */
    padding: var(--jui-layout-padding-xs)
             var(--jui-layout-padding-xs)
             var(--jui-layout-padding-xs)
             var(--jui-layout-padding-s);                     /* 8 8 8 12 */
    justify-content: space-between;
  }
  .social-frame--figma .share-link-pill:hover,
  .social-frame--figma .share-link-pill:focus-visible { background: var(--jui-color-blue-50); }

</style>
</head>
<body>

<div class="app-shell">
  <div class="success-container">
    <div class="success-content">
      <div class="success-layout">

        <div class="success-title success-title--mobile">
          <h1 class="success-headline" data-inspect-phrase="explainerStatic.bio.title">Your bio page is ready!</h1>
        </div>

        <!-- ─── Preview column: blob + confetti + chrome-less phone ─── -->
        <div class="preview-column">
          <div class="preview-blob" aria-hidden="true"

<!-- Confetti — loops-frontend components/Confetti/Confetti.tsx: 45 seeded
     dots, identical formulas, built as inline DOM so the static page
     reproduces the burst without React. -->
<script>
  (function () {
    var COLORS = ['#8DA7FF', '#B5F2CE', '#A350D9', '#FFC77B', '#336BFF', '#7DEAAF', '#E4B5FF'];
    var DOT_COUNT = 45;
    function seededRandom(seed) {
      var x = Math.sin(seed * 9301 + 49297) * 233280;
      return x - Math.floor(x);
    }
    var root = document.getElementById('confetti');
    if (!root) return;
    for (var i = 0; i < DOT_COUNT; i++) {
      var rand = (function (idx) {
        return function (offset) { return seededRandom(idx * 7 + offset); };
      })(i);
      var x = document.createElement('div');
      x.className = 'confetti-x';
      x.style.setProperty('--dot-left', (-5 + rand(0) * 10) + '%');
      x.style.setProperty('--dot-delay', (rand(1) * 0.06) + 's');
      x.style.setProperty('--dot-duration', (2.5 + rand(2) * 1.5) + 's');
      x.style.setProperty('--dot-x-drift', ((rand(3) - 0.5) * 500) + 'px');
      var y = document.createElement('div');
      y.className = 'confetti-y';
      y.style.setProperty('--dot-delay', (rand(1) * 0.06) + 's');
      y.style.setProperty('--dot-duration', (2.5 + rand(2) * 1.5) + 's');
      y.style.setProperty('--dot-y-peak', (-(120 + rand(4) * 160)) + 'px');
      y.style.setProperty('--dot-y-end', (80 + rand(5) * 120) + 'px');
      var dot = document.createElement('div');
      dot.className = 'confetti-dot';
      dot.style.setProperty('--dot-color', COLORS[i % COLORS.length]);
      dot.style.setProperty('--dot-delay', (rand(1) * 0.06) + 's');
      dot.style.setProperty('--dot-duration', (2.5 + rand(2) * 1.5) + 's');
      dot.style.setProperty('--dot-size', (3 + rand(6) * 2) + 'px');
      dot.style.setProperty('--dot-rotate', (rand(7) * 360) + 'deg');
      y.appendChild(dot);
      x.appendChild(y);
      root.appendChild(x);
    }
  })();
</script>

<!-- PhoneScaler — mirrors loops-frontend PhoneScaler.tsx: the artifact
     renders at its native 360×713 and is scaled to whatever size the
     frame resolves to at the current breakpoint. -->
<script>
  (function () {
    var frame = document.getElementById('phone-frame');
    if (!frame) return;
    function fit() {
      var w = frame.clientWidth;
      if (!w) return;
      frame.style.setProperty('--phone-scale', (w / 360).toFixed(4));
    }
    if (window.ResizeObserver) new ResizeObserver(fit).observe(frame);
    window.addEventListener('resize', fit);
    fit();
    window.addEventListener('load', fit);
  })();
</script>

<!-- QR visual + share / download actions. The canvas is a non-scannable
     prototype visual; production renders qrcode.js at the same 110px
     (loops-frontend FlowCardQRCode.tsx, SuccessShareBlock QR_CODE_SIZE). -->
<script>
  (function initQR() {
    var canvas = document.getElementById('qr-canvas');
    if (!canvas) return;
    function render() {
      var size = 110;
      var dpr = window.devicePixelRatio || 1;
      var px = Math.round(size * dpr);
      canvas.width = px;
      canvas.height = px;
      drawQR(canvas.getContext('2d'), px);
    }
    if (document.readyState === 'complete') render();
    else window.addEventListener('load', render);
  })();

  function drawQR(ctx, px) {
    var M = 29;
    var pad = Math.round(px * 0.055);
    var inner = px - pad * 2;
    var cell = inner / M;
    ctx.clearRect(0, 0, px, px);
    ctx.fillStyle = '#000';
    var s = 0xA5A5A5A5;
    function rand() {
      s = Math.imul(s ^ (s >>> 15), s | 1);
      s ^= s + Math.imul(s ^ (s >>> 7), s | 61);
      return ((s ^ (s >>> 14)) >>> 0) / 0xFFFFFFFF;
    }
    function isReserved(x, y) {
      var inTL = (x < 9 && y < 9);
      var inTR = (x >= M - 9 && y < 9);
      var inBL = (x < 9 && y >= M - 9);
      var timing = (x === 6 || y === 6);
      return inTL || inTR || inBL || timing;
    }
    for (var y = 0; y < M; y++) {
      for (var x = 0; x < M; x++) {
        if (isReserved(x, y)) continue;
        if (rand() > 0.48) {
          ctx.fillRect(pad + x * cell, pad + y * cell, cell - 0.4, cell - 0.4);
        }
      }
    }
    for (var i = 8; i < M - 8; i++) {
      if (i % 2 === 0) {
        ctx.fillRect(pad + 6 * cell, pad + i * cell, cell, cell);
        ctx.fillRect(pad + i * cell, pad + 6 * cell, cell, cell);
      }
    }
    function finder(ox, oy) {
      for (var dy = 0; dy < 7; dy++) {
        for (var dx = 0; dx < 7; dx++) {
          var onRing = (dx === 0 || dx === 6 || dy === 0 || dy === 6);
          var onCenter = (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4);
          if (onRing || onCenter) {
            ctx.fillRect(pad + (ox + dx) * cell, pad + (oy + dy) * cell, cell, cell);
          }
        }
      }
    }
    finder(0, 0);
    finder(M - 7, 0);
    finder(0, M - 7);
    [[7, 8], [8, 7], [8, 8]].forEach(function (p) {
      ctx.fillRect(pad + p[0] * cell, pad + p[1] * cell, cell, cell);
    });
  }

  var PAGE_URL = 'https://claranstone.jimdosite.com/bio';
  var SHARE_TEXT = 'Check out my bio page';

  function on(id, fn) { var el = document.getElementById(id); if (el) el.addEventListener('click', fn); }

  on('link-btn', function () { window.open(PAGE_URL, '_blank', 'noopener,noreferrer'); });
  on('share-btn', function () {
    if (navigator.share) { navigator.share({ title: SHARE_TEXT, url: PAGE_URL }).catch(function () {}); }
    else if (navigator.clipboard) { navigator.clipboard.writeText(PAGE_URL).catch(function () {}); showToast('Link copied'); }
  });
  on('download-btn', function () {
    var canvas = document.getElementById('qr-canvas');
    if (!canvas) return;
    try {
      var link = document.createElement('a');
      link.download = 'qr-code.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    } catch (e) { showToast('Download started'); }
  });
  on('social-whatsapp', function () {
    window.open('https://wa.me/?text=' + encodeURIComponent(SHARE_TEXT + ' ' + PAGE_URL), '_blank', 'noopener,noreferrer');
  });
  on('social-facebook', function () {
    window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(PAGE_URL), '_blank', 'noopener,noreferrer');
  });
  on('social-email', function () {
    window.location.href = 'mailto:?subject=' + encodeURIComponent('Check this out') + '&body=' + encodeURIComponent(SHARE_TEXT + ' ' + PAGE_URL);
  });
  on('social-instagram', function () {
    if (navigator.clipboard) { navigator.clipboard.writeText(PAGE_URL).catch(function () {}); }
    showToast('Link copied for Instagram');
  });

  function showToast(message) {
    var container = document.getElementById('toast-container');
    if (!container) return;
    var toast = document.createElement('div');
    toast.className = 'toast toast-success';
    toast.innerHTML =
      '<span class="toast-icon">' +
        '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true" width="20" height="20">' +
          '<path d="M4.25 13.5L8.75 18L19.75 6" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>' +
        '</svg>' +
      '</span>' +
      '<span class="toast-message">' + message + '</span>';
    container.appendChild(toast);
    setTimeout(function () {
      toast.classList.add('toast-hiding');
      setTimeout(function () { toast.remove(); }, 300);
    }, 2500);
  }
</script>
