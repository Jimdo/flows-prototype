<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bio Page — Preview</title>
<link rel="stylesheet" href="/flows-prototype/design-system/dist/layout.css?v=1b8aa32">
<link rel="stylesheet" href="/flows-prototype/design-system/dist/components.css?v=1b8aa32">
<!-- Baseline tokens (synced from @jimdo/ui) load LAST so upstream wins for
     every redeclared --jui-*. See kb/design-analysis/2026-05-11_jui-token-divergence-decisions.md
     for the 5 truly-divergent tokens we deliberately accepted from upstream. -->
<link rel="stylesheet" href="/flows-prototype/design-system/dist/baseline/jui-tokens.css?v=1b8aa32">
<style>

  /* ═══════════════════════════════════════════════
     PAGE SHELL
     Shell shares the gray canvas — header and footer
     blend with the canvas background, no white bars.
     Figma 14255:71964
     ═══════════════════════════════════════════════ */

  .app-shell,
  .shell-header,
  .shell-working-area,
  .shell-footer {
    background: var(--jui-color-background-gray-canvas, var(--jui-color-gray-50));
    box-shadow: none;
    border-bottom: none;
    border-top: none;
  }

  /* shell-working-area is a flex column that hosts the centered rail.
     No bottom padding — Figma has the card bottom flush against the
     footer's internal p-16, giving a 16px gap to the tab row. */
  .shell-working-area {
    display: flex;
    flex-direction: column;
    min-height: 0;
    padding: 0;
    overflow: hidden;
  }

  /* Working-area rail: max-width 992 with NO horizontal padding so
     the card outer is flush with the 992 wrapper edge (Figma 14255:71971).
     The header above and footer below use .content-container, which adds
     16px inner padding — that's why the header label sits 16px inset
     while the card extends to the wrapper edge. The card inside the rail
     flex-grows to fill available height (matches Figma 14255:71971's
     flex-[1_0_0]); phone stays at native size centered in the card. */
  .shell-working-area > .preview-stage-rail {
    flex: 1;
    min-height: 0;
    width: 100%;
    max-width: var(--layout-container-max);
    margin: 0 auto;
    display: flex;
    flex-direction: column;
  }

  /* ─────────────────────────────────────────────
     HEADER — "PREVIEWING" label + Save and Continue
     Figma 14255:71967
     ───────────────────────────────────────────── */

  /* .page-header + .page-header-label are shared via components.css
     (Layer 4.5 — Screen header). Save button uses .btn-primary.btn-sm. */

  /* ═══════════════════════════════════════════════
     STAGE CARD — white panel holding the phone preview
     Figma 14255:71971 (HorizontalScroll)
     ═══════════════════════════════════════════════ */

  /* Card flex-grows to fill rail height (Figma flex-[1_0_0]).
     Phone sits at native 230×455.6 centered. On taller viewports
     the card is taller; phone stays the same size — matches Figma. */
  .preview-stage-card {
    flex: 1 0 0;
    min-height: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--jui-layout-padding-m);
    background: var(--jui-color-gray-white);
    border: 1px solid var(--jui-color-gray-50);
    border-radius: var(--jui-style-radius-20, 20px);
    box-shadow: 0 4px 12px 0 rgba(0, 0, 0, 0.02);
    overflow: hidden;
  }

  /* ═══════════════════════════════════════════════
     PHONE STAGE — centers the 230×455.6px phone frame at native size
     Figma 14255:71972 (FlowPage)
     ═══════════════════════════════════════════════ */

  .phone-stage {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .phone-frame {
    width: 230px;
    height: 455.6px;
    background: var(--jui-color-gray-black);
    border: 1.1px solid var(--jui-color-gray-100);
    border-radius: 16px;
    box-shadow: 0 4.4px 26.5px rgba(0, 0, 0, 0.10);
    padding: 4px;
    flex-shrink: 0;
  }

  /* Concentric inner: 17.7 − 4.4 = 13.3 */
  .phone-inner {
    width: 221.2px;
    height: 446.8px;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    background: var(--jui-color-gray-black);
  }

  /* ═══════════════════════════════════════════════
     ARTIFACT IFRAME — Bio page loaded as standalone doc
     Native 360×727 (approx) → scaled by 0.6144 to fit
     the 221.2×446.8 phone-inner (360 × 0.6144 = 221.2).
     ═══════════════════════════════════════════════ */
  .artifact-iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 360px;
    height: 727px;
    border: 0;
    background: var(--jui-color-gray-black);
    transform: scale(0.6144);
    transform-origin: top left;
  }

  /* ═══════════════════════════════════════════════
     FOOTER ACTIONS — blue-tinted capsule tabs
     Figma 14255:72084 (Actions Container)
     ═══════════════════════════════════════════════ */

  /* content-container provides the 16px horizontal padding; this
     row supplies the 16px vertical padding to match Figma's p-16. */
  .preview-footer-actions {
    width: 100%;
    padding: var(--jui-layout-padding-m) 0;
    display: flex;
    gap: var(--jui-layout-gap-s, 12px);
    align-items: center;
    justify-content: flex-start;
  }

  /* Capsule tab — Figma 14255:72085 + 14255:72086.
     Nested in Figma: outer pill (px-24 py-4 rounded-32) wraps an inner
     default-button row (pl-8 pr-12 py-4 h-32 gap-8). We preserve the
     nesting via .preview-tab-inner so every value stays on-scale. */
  .preview-tab {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: var(--jui-layout-padding-xxs) var(--jui-layout-padding-l);
    background: var(--jui-color-blue-10);
    border: 1px solid var(--jui-color-blue-400);
    border-radius: 32px;
    color: var(--jui-color-blue-500);
    font-family: inherit;
    font-size: var(--jui-typography-body-small-medium-size);
    font-weight: var(--jui-typography-body-small-medium-weight);
    line-height: var(--jui-typography-body-small-medium-lh);
    letter-spacing: var(--jui-typography-link-small-ls);
    cursor: pointer;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }

  .preview-tab-inner {
    display: inline-flex;
    align-items: center;
    gap: var(--jui-layout-gap-xs, 8px);
    height: 32px;
    padding: var(--jui-layout-padding-xxs) var(--jui-layout-padding-s) var(--jui-layout-padding-xxs) var(--jui-layout-padding-xs);
  }

  .preview-tab:hover {
    background: var(--jui-color-blue-50);
  }

  .preview-tab:focus-visible {
    outline: 2px solid var(--jui-color-blue-500);
    outline-offset: 2px;
  }

  .preview-tab svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }

</style>
</head>
<body>

<div class="app-shell">

  <header class="shell-header no-pad-y">
    <div class="content-container">
      <div class="page-header">
        <span class="page-header-label" data-inspect-phrase="preview.bioSite.pageHeader">Previewing</span>
        <button class="btn-primary btn-sm" data-nav-to="flows/paywall-domain.html" data-inspect-phrase="preview.bioSite.saveCta">Save and Continue</button>
      </div>
    </div>
  </header>

  <div class="shell-middle">
    <div class="shell-working-area">
      <div class="preview-stage-rail">
        <div class="preview-stage-card">
          <div class="phone-stage" id="phone-stage">
            <div class="phone-frame">
              <div class="phone-inner">
                <!-- Artifact loaded as standalone document. Src can be swapped to preview other artifacts (e.g. flow-page.html). -->
                <iframe
                  class="artifact-iframe"
                  id="artifact-iframe"
                  src="../artifacts/bio-page.html"
                  title="Bio page artifact"
                  loading="eager"></iframe>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="shell-footer no-pad-y">
    <div class="content-container">
      <div class="preview-footer-actions" role="tablist" aria-label="View switcher">
        <!-- Page tab — Hugeicons SmartPhone01Icon -->
        <button class="preview-tab" id="tab-design" aria-pressed="true" aria-label="Page tab"
                data-nav-to="flows/design-editor.html?page=bio-page"
                data-nav-display-url="ama-wellness.jimdo.site/design"
                data-nav-screen-id="scr-132">
          <span class="preview-tab-inner">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
              <path d="M17 2H7C5.89543 2 5 2.89543 5 4V20C5 21.1046 5.89543 22 7 22H17C18.1046 22 19 21.1046 19 20V4C19 2.89543 18.1046 2 17 2Z" stroke="currentColor" stroke-linejoin="round" stroke-width="1.5"/>
              <path d="M11 19H13" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
              <path d="M9 2L9.77208 4.31623C9.90819 4.72457 10.2903 5 10.7208 5H13.2792C13.7097 5 14.0918 4.72457 14.2279 4.31623L15 2" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            <span data-inspect-phrase="bio.tab.page">Page</span>
          </span>
        </button>
        <!-- Links tab — Hugeicons Menu01Icon -->
        <button class="preview-tab"
                id="tab-links"
                aria-pressed="false"
                aria-label="Links tab"
                data-nav-to="flows/bio-page-links-edit.html"
                data-nav-display-url="ama-wellness.jimdo.site/edit"
                data-nav-screen-id="scr-120">
          <span class="preview-tab-inner">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 5L20 5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
              <path d="M4 12L20 12" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
              <path d="M4 19L20 19" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
            </svg>
            <span data-inspect-phrase="bio.tab.links">Links</span>
          </span>
        </button>
      </div>
    </div>
  </footer>

</div>

<script src="/flows-prototype/design-system/hifi-designs/prototype-nav.js?v=1b8aa32"></script>

</body>
</html>
