<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=360, initial-scale=1">
<title>WhatsApp message — launch asset</title>
<style>
  /* Ready-made WhatsApp broadcast (360×727) for a jewellery artist —
     a workshop invite to her contacts. Self-contained artifact; raw
     colors allowed in pages/artifacts/. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 360px; height: 727px; }
  body {
    font-family: 'Euclid Circular A', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #efe7de;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .wa-header {
    display: flex; align-items: center; gap: 12px;
    background: #075e54; color: #fff; padding: 16px; flex-shrink: 0;
  }
  .wa-back { font-size: 22px; line-height: 1; opacity: 0.9; }
  .wa-avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, #25d366, #128c7e);
    display: flex; align-items: center; justify-content: center; font-size: 18px;
  }
  .wa-title { display: flex; flex-direction: column; }
  .wa-name { font-size: 16px; font-weight: 600; }
  .wa-meta { font-size: 12px; opacity: 0.8; }
  .wa-chat {
    flex: 1; padding: 20px 14px;
    display: flex; flex-direction: column; justify-content: flex-start; gap: 10px;
    background-image: linear-gradient(rgba(239,231,222,0.92), rgba(239,231,222,0.92));
  }
  .wa-day {
    align-self: center; background: #d6effb; color: #41525d;
    font-size: 12px; font-weight: 500; padding: 5px 12px; border-radius: 8px; margin-bottom: 6px;
  }
  .wa-bubble {
    align-self: flex-end; max-width: 86%;
    background: #dcf8c6; border-radius: 12px 12px 2px 12px;
    padding: 10px 12px 8px; box-shadow: 0 1px 1px rgba(0,0,0,0.08); position: relative;
  }
  .wa-text { font-size: 15px; line-height: 1.45; color: #1f2c34; white-space: pre-line; }
  .wa-link {
    margin-top: 8px; background: rgba(0,0,0,0.05);
    border-left: 3px solid #34b7f1; border-radius: 6px; padding: 8px 10px;
  }
  .wa-link-title { font-size: 13px; font-weight: 600; color: #1f2c34; }
  .wa-link-url { font-size: 12px; color: #5b6b73; margin-top: 2px; }
  .wa-stamp {
    display: flex; align-items: center; justify-content: flex-end; gap: 4px;
    font-size: 11px; color: #667781; margin-top: 4px;
  }
  .wa-ticks { color: #34b7f1; font-size: 13px; }
  .wa-input { display: flex; align-items: center; gap: 10px; padding: 8px 12px 14px; flex-shrink: 0; }
  .wa-input-field {
    flex: 1; background: #fff; color: #8a99a0; font-size: 14px;
    border-radius: 999px; padding: 11px 16px;
  }
  .wa-send {
    width: 42px; height: 42px; border-radius: 50%;
    background: #128c7e; color: #fff; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 18px;
  }
</style>
</head>
<body>
  <div class="wa-header">
    <span class="wa-back">‹</span>
    <div class="wa-avatar">👥</div>
    <div class="wa-title">
      <span class="wa-name">WhatsApp Group</span>
      <span class="wa-meta">12 members</span>
    </div>
  </div>
  <div class="wa-chat">
    <div class="wa-day">Today</div>
    <div class="wa-bubble">
      <div class="wa-text">Hi! ✨ I'm running free trial jewellery sessions this Saturday — design your own piece, materials included. Just a few seats left.

Want one? Grab a spot here 👇</div>
      <div class="wa-link">
        <div class="wa-link-title">Clara and Stone — Book your session</div>
        <div class="wa-link-url">claraandstone.jim.do</div>
      </div>
      <div class="wa-stamp">9:41 <span class="wa-ticks">✓✓</span></div>
    </div>
  </div>
  <div class="wa-input">
    <div class="wa-input-field">Message</div>
    <div class="wa-send">➤</div>
  </div>
</body>
</html>
