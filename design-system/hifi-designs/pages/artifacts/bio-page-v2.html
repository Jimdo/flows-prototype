<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=360, initial-scale=1">
<title>Clara and Stone — Bio Page</title>
<style>
  /* ═══════════════════════════════════════════════
     ARTIFACT — DARK TEMPLATE "Clara and Stone"
     Standalone bio-page document. Rendered either
     directly (standalone) or inside an iframe in
     bio-page-preview.html at scale(0.6144).
     Native mobile width: 360px.
     ═══════════════════════════════════════════════ */

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #0a0a0a;
    -webkit-font-smoothing: antialiased;
  }

  body {
    font-family: 'Familjen Grotesk', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    color: #fff;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .bio-page {
    /* One fill for every placeholder. Different alphas per block read as a
       hierarchy among things that do not exist yet — a ghost is a ghost. */
    --bio-ghost-fill: rgba(255, 255, 255, 0.08);
    width: 100%;
    max-width: 360px;
    min-height: 100vh;
    margin: 0 auto;
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    padding-top: 0;
  }

  /* ── Zone A — Hero (Figma 13503:15594-15597) ──
     Figma: title absolute at left=115 top=75 in 230-scale
     = centered at (180, 117) in 360-native, overlapping image top.
     Image 115 → 180 square, starts at pt 97.111 → 152.
     Title 37.33 → 58, line-height 0.8.
     Share 20.444 → 32, icon 15.333 → 24, bg rgba(0,0,0,0.30). */
  .bio-hero {
    position: relative;
    padding: 71px 20px 16px; /* title starts at ~71 so image (title-bottom + small overlap) lands ~152 */
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }
  .bio-hero-title {
    font-size: 58px;
    font-weight: 700;
    line-height: 0.8;
    letter-spacing: -1.75px;
    text-transform: uppercase;
    color: #ffffff;
    margin: 0 0 -12px; /* overlap image top by 12px — matches Figma title/image overlap */
    text-align: center;
    width: 100%;
    position: relative;
    z-index: 1;
  }
  .bio-hero-img-wrap {
    position: relative;
    width: 180px;
    height: 180px;
    border-radius: 16px;
    overflow: hidden;
    background: var(--bio-ghost-fill);
    flex-shrink: 0;
  }
  .bio-hero-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 30%;
  }
  /* Image placeholder — stands in before a photo is uploaded.
     Same silhouette the upload control shows in the edit column, so
     the preview and the control read as the same thing.
     Figma 12290:21643 / 22073. */
  .bio-hero-img-placeholder {
    position: absolute;
    inset: 0;
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 36px;
    gap: 9px;
    overflow: hidden;
  }
  .bio-hero-img-placeholder::before,
  .bio-hero-img-placeholder::after {
    content: '';
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.14);
    flex-shrink: 0;
  }
  .bio-hero-img-placeholder::before { width: 90px; height: 90px; }
  .bio-hero-img-placeholder::after { width: 166px; height: 166px; }

  /* Edit highlight — marks the part of the page the field currently
     being edited changes. Driven by {type:'bio-config', highlight:…}.
     Figma 12290:22098. */
  .bio-edit-target {
    transition: background-color 180ms ease, box-shadow 180ms ease;
  }
  .bio-edit-target.is-highlighted {
    background-color: rgba(0, 76, 237, 0.2);
    box-shadow: 0 0 0 5px rgba(0, 76, 237, 0.2);
    outline: 2px solid #336bff;
    outline-offset: 5px;
  }

  .bio-hero-share {
    position: absolute;
    top: 14px;
    right: 11px;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    z-index: 2;
  }
  .bio-hero-share svg { width: 18px; height: 18px; stroke-width: 1.5; }

  /* ── Subtitle (Figma 13503:15598-15599) ──
     font 11.5 → 18, color #aaa. Bottom padding bumped to 32
     to create a clear hero → content section break. */
  .bio-subtitle {
    font-size: 18px;
    font-weight: 400;
    color: #aaa;
    text-align: center;
    line-height: 1.4;
    padding: 20px 20px 40px;
    margin: 0;
  }

  /* ── Zone B — Contact Buttons ──
     Aligned with buttons and info blocks: px 12, pb 16 (card-zone rhythm). */
  /* hidden must beat the component display rules below (class display would
     otherwise override the attribute). Scoped to the live-config nodes. */
  .bio-hero-img-placeholder[hidden],
  .bio-contact-buttons[hidden], .bio-contact-btn[hidden], .bio-info-map[hidden],
  .bio-link-btn[hidden], .bio-socials[hidden], .bio-jimdo-promo-wrap[hidden],
  .bio-legal[hidden], .bio-withdraw-section[hidden],
  .bio-rich-btn[hidden], .bio-rich-btn-meta[hidden],
  .bio-rich-btn-cta-price[hidden] { display: none !important; }
  .bio-contact-buttons {
    display: flex;
    justify-content: center;
    padding: 0 12px 16px;
  }
  /* The row is padded so the buttons clear the page edges; the group inside
     is only as wide as the buttons. Marking the group rather than the row is
     what keeps the highlight on the content, the way it already sits on the
     main link and the offer card. */
  .bio-contact-group {
    display: inline-flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }
  .bio-contact-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 34px;
    padding: 0 16px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.10);
    border: 1px solid rgba(255, 255, 255, 0.14);
    color: #fff;
    font-size: 14px;
    font-weight: 500;
  }
  .bio-contact-btn svg { width: 14px; height: 14px; opacity: 0.85; }

  /* ── Ghosts ──
     A block the seller has not filled in yet, drawn as the shape it will
     become. The page then keeps its proportions from the first step instead
     of growing a piece at a time, and the empty slot reads as an invitation
     rather than as something missing. Content is held back with visibility
     so the box keeps the size the real thing will have. */
  .bio-ghost { pointer-events: none; }
  /* Hiding the children rather than removing them keeps the box the size the
     real thing will be, and leaves one flat fill rather than a well, a
     footer and a container each at their own alpha. */
  .bio-ghost > * { visibility: hidden; }
  .bio-socials.bio-ghost > * { visibility: visible; }

  /* Sample content inside a real control. The action bar is honest — it says
     what the piece does — but the words and picture around it are not the
     seller's yet, so they are drawn as shapes. The card then reads as an
     example of what is being made rather than as something already made. */
  /* Scoped to the card so it outranks the title's and the meta's own
     colours, which are declared further down. */
  .bio-rich-btn .bio-sample-text {
    color: transparent;
    background: var(--bio-ghost-fill);
    border-radius: 999px;
    display: inline-block;
  }

  /* Two rows rather than two bars of the same length. A title runs the width
     of its block and the line under it breaks — so row one is one bar edge to
     edge, and row two is a long piece and a short one. Both are drawn at the
     height of a line of text, not the height of the line box, so the card
     keeps the exact proportions it will have once the words are real. */
  .bio-rich-btn-title.bio-sample-text {
    display: block;
    width: 100%;
    height: 14px;
    margin: 6px 0;
  }
  .bio-rich-btn-meta.bio-sample-text {
    background: none;
    display: flex;
    align-items: center;
    gap: 6px;
    /* Collapses the sample words to nothing so the two pieces below are the
       whole row; the height holds the space the real line would take. */
    font-size: 0;
    height: 18px;
  }
  .bio-rich-btn-meta.bio-sample-text::before,
  .bio-rich-btn-meta.bio-sample-text::after {
    content: '';
    height: 10px;
    border-radius: 999px;
    background: var(--bio-ghost-fill);
  }
  .bio-rich-btn-meta.bio-sample-text::before { width: 42%; }
  .bio-rich-btn-meta.bio-sample-text::after { width: 24%; }

  /* The picture slot gets the silhouette the hero placeholder uses, not a
     flat bar. A missing picture is a specific kind of missing, and the page
     already has one way of saying it. */
  .bio-sample-img { background: none; }
  /* Two classes deep, because .bio-rich-btn-img img sets display further
     down the sheet and a single class would quietly lose to it. */
  .bio-rich-btn-img.bio-sample-img img { display: none; }
  .bio-rich-btn-img-placeholder {
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 12px;
    gap: 3px;
    background: var(--bio-ghost-fill);
    box-sizing: border-box;
  }
  .bio-rich-btn-img-placeholder::before,
  .bio-rich-btn-img-placeholder::after {
    content: '';
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.14);
    flex-shrink: 0;
  }
  .bio-rich-btn-img-placeholder::before { width: 30px; height: 30px; }
  .bio-rich-btn-img-placeholder::after { width: 56px; height: 56px; }

  .bio-contact-ghost { width: 93px; }

  /* Socials ghost to round slots. The icons are recognisable brands, and a
     recognisable brand on a page that has not been given one reads as a link
     the seller already added. */
  /* A line of text that has not been written yet. Sized to its own content
     so the bar is the length the line will be, not the width of the box it
     sits in. */
  /* inline-block so the box is the line, not the column it is centred in */
  .bio-subtitle-text { display: inline-block; }

  .bio-ghost-text {
    color: transparent;
    background: var(--bio-ghost-fill);
    border-radius: 999px;
    display: inline-block;
    min-width: 160px;
  }

  .bio-socials.bio-ghost { pointer-events: none; }
  .bio-socials.bio-ghost .bio-social-dot {
    border-radius: 50%;
    background: var(--bio-ghost-fill);
  }
  .bio-socials.bio-ghost .bio-social-dot svg { visibility: hidden; }

  /* ── Zone C — Blocks (merged buttons + info + map) ──
     Single container holds every tappable row. 12px gap between items
     gives rich cards (which carry more content) room to breathe without
     losing group identity. Px 12 container inset matches the buttons'
     Figma mapping. Bottom padding bumped to 40 to create a clear
     content → socials section break that balances the upstream hero break.
     Visual hierarchy is carried by item bg/radius, not spacing. */
  .bio-blocks {
    padding: 0 12px 40px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* Invisible wrapper grouping consecutive .bio-link-btn items. No
     background, border, or padding — layout-only. It carries the same 12px
     the blocks around it use: every tappable row on the page is its own
     thing, and a tighter stack inside the group made two main buttons read
     as one control split in half. */
  .bio-link-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* Button row — primary action (bg 0.15, radius 16) */
  /* A link that is on the page but cannot do its job yet — the same state
     the offer card marks, said on a plain button. Dashed and dimmed, so it
     reads as a place being held rather than as something live. */
  .bio-link-btn[data-pending="true"] {
    opacity: 0.45;
    border: 1px dashed currentColor;
  }

  .bio-link-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 48px;
    padding: 16px 20px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
    font-size: 16px;
    font-weight: 400;
    line-height: 1;
    text-align: left;
    letter-spacing: 0;
    gap: 8px;
  }
  .bio-link-arrow { width: 16px; height: 16px; opacity: 0.85; flex-shrink: 0; }

  /* ── Rich button (Figma 13696:81844) ──
     Two-part card: info header (image + bold title) stacked over an action
     row (CTA label + arrow), separated by a 1px gap so the dark page bg
     shows through as a thin divider. Shared visual style across variants
     (book / pay / promo); differentiated purely by content. */
  .bio-rich-btn {
    display: flex;
    flex-direction: column;
    gap: 1px;
    border-radius: 16px;
  }

  /* ── Added but not finished ──
     The seller has chosen this piece and not yet given it a date, a price or
     a place, so it cannot take an order. It stays where it is and dims with a
     marker over it rather than disappearing: the whole point being made is
     that THIS is the part that is not ready, and a block that is not there
     cannot make that point. The halves dim, the marker does not — it is the
     one thing on the card that is a fact. */
  .bio-rich-btn { position: relative; }
  .bio-rich-btn > .bio-rich-btn-info,
  .bio-rich-btn > .bio-rich-btn-cta { transition: opacity 280ms ease; }
  .bio-rich-btn[data-pending="true"] > .bio-rich-btn-info,
  .bio-rich-btn[data-pending="true"] > .bio-rich-btn-cta { opacity: 0.3; }

  /* Kept in the box rather than toggled with display, so the pill has
     something to animate from when the state turns on. */
  .bio-pending {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 200ms ease;
  }
  .bio-rich-btn[data-pending="true"] .bio-pending { opacity: 1; }
  .bio-pending-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.92);
    color: #000;
    font-size: 13px;
    font-weight: 500;
    line-height: 1.3;
    transform: scale(0.88);
    transition: transform 280ms cubic-bezier(0.32, 0.72, 0, 1);
  }
  .bio-rich-btn[data-pending="true"] .bio-pending-pill { transform: none; }
  .bio-pending-pill svg { width: 15px; height: 15px; flex-shrink: 0; }

  /* Top: 80px square image + bold title, tl/tr 16, bl/br 6 */
  .bio-rich-btn-info {
    display: flex;
    align-items: stretch;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 16px 16px 6px 6px;
  }

  .bio-rich-btn-img {
    flex-shrink: 0;
    padding: 8px 0 8px 8px;
    /* No vertical centring on purpose. The wrap stretches to match the info
       block height, but the image sits at a fixed 8px from the top on every
       card so image tops line up across BOOK / PAY / PROMO regardless of
       how tall the info content is. */
  }

  .bio-rich-btn-img img,
  .bio-rich-btn-img .bio-rich-btn-img-placeholder {
    display: block;
    width: 80px;
    height: 80px;
    /* Concentric corners: outer card radius 16 − 8px wrap padding = 8px inner.
       Diverges from Figma's 12 to hold concentric rhythm as cards vary in size. */
    border-radius: 8px;
    object-fit: cover;
    background: #1a1015;
  }

  .bio-rich-btn-title-wrap {
    flex: 1 1 0;
    min-width: 0;
    padding: 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .bio-rich-btn-title {
    font-size: 20px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.85);
    line-height: 1.3;
    margin: 0;
    letter-spacing: -0.2px;
  }

  /* Meta row — secondary info beneath the title. Used by BOOK (date/time)
     and PAY (shipping, stock). 13px muted so it doesn't compete with the
     20px title. Price lives in the CTA bar, not here — keeps info area
     short and reserves the bottom bar for transactional data. */
  .bio-rich-btn-meta {
    font-size: 13px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.6);
    line-height: 1.4;
    margin: 6px 0 0;
  }

  /* Leading icon in the CTA bar — used by BOOK for a calendar glyph that
     signals scheduling without replacing the photo. */
  .bio-rich-btn-cta-icon {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    color: #fff;
    opacity: 0.85;
  }

  /* Trailing price accent in the CTA bar — used by BOOK and PAY. Sits
     between the flex-1 label and the arrow so the action verb leads and
     the commercial value reads as a tight right-hand accent. */
  .bio-rich-btn-cta-price {
    flex-shrink: 0;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    line-height: 1;
    letter-spacing: -0.2px;
  }

  /* Bottom: CTA + arrow. tl/tr 6, bl/br 16 to mirror the info header */
  .bio-rich-btn-cta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 48px;
    padding: 16px 20px;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 6px 6px 16px 16px;
  }

  .bio-rich-btn-cta-label {
    flex: 1 1 0;
    min-width: 0;
    font-size: 16px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.85);
    line-height: 1.3;
  }

  .bio-rich-btn-cta-arrow {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    opacity: 0.7;
  }

  /* ══════════════════════════════════════════════════════════════════════
     Rich button — VARIATIONS
     Each variant unlocks a use case the default layout handles poorly.
     All share the base .bio-rich-btn outer (flex-column gap 1px + radius 16).
     ══════════════════════════════════════════════════════════════════════ */

  /* ── BOOK Featured ──
     Full-width image hero on top. Three stacked rows (hero / info / CTA)
     separated by 1px gaps, preserving the family's ribbon divider pattern.
     Use for signature events where the photo sells the experience. */
  .bio-rich-btn--featured .bio-rich-btn-hero {
    width: 100%;
    height: 180px;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 16px 16px 6px 6px;
  }
  .bio-rich-btn--featured .bio-rich-btn-hero img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 400ms ease-out;
  }
  /* Middle row: no image on left; title + meta stack directly inside info */
  .bio-rich-btn--featured .bio-rich-btn-info {
    flex-direction: column;
    align-items: stretch;
    padding: 14px 20px;
    border-radius: 6px;
  }
  .bio-rich-btn--featured .bio-rich-btn-info .bio-rich-btn-title {
    margin: 0;
  }
  .bio-rich-btn--featured .bio-rich-btn-info .bio-rich-btn-meta {
    margin: 4px 0 0;
  }

  /* ── PAY Tip Jar ──
     Top half identical to base PAY (image + title + meta). Bottom half
     swaps the single CTA for a chip grid so users can tap a preset amount
     in one action. Each chip is its own interactive surface. */
  .bio-rich-btn-chips {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    min-height: 48px;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 6px 6px 16px 16px;
  }
  .bio-rich-btn-chip {
    flex: 1 1 0;
    min-width: 0;
    height: 36px;
    padding: 0 10px;
    border-radius: 18px;
    border: 1px solid rgba(255, 255, 255, 0.22);
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0;
    cursor: pointer;
    transition: background-color 180ms ease-out,
                border-color 180ms ease-out,
                transform 150ms ease-out;
  }
  .bio-rich-btn-chip:focus-visible {
    outline: 2px solid rgba(255, 255, 255, 0.55);
    outline-offset: 2px;
  }
  @media (hover: hover) {
    .bio-rich-btn-chip:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.35);
    }
  }
  .bio-rich-btn-chip:active {
    transform: scale(0.94);
    transition-duration: 80ms;
  }
  @media (prefers-reduced-motion: reduce) {
    .bio-rich-btn-chip { transition: none; }
    .bio-rich-btn-chip:active { transform: none; }
  }

  /* ── PROMO Immersive ──
     Full-bleed image with a dark bottom gradient; title + eyebrow + arrow
     sit on top. Single layer — no internal divider, no CTA bar — the
     whole card is the tap target. Taller (220px) than the standard rich
     button to earn its editorial hero role. */
  .bio-rich-btn--immersive {
    position: relative;
    display: block;
    width: 100%;
    height: 220px;
    border-radius: 16px;
    overflow: hidden;
    gap: 0;
  }
  .bio-rich-btn-immersive-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 400ms ease-out;
  }
  .bio-rich-btn-immersive-overlay {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    background: linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0) 0%,
      rgba(0, 0, 0, 0.55) 55%,
      rgba(0, 0, 0, 0.85) 100%
    );
  }
  .bio-rich-btn-immersive-eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.78);
  }
  .bio-rich-btn-immersive-headline-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .bio-rich-btn-immersive-headline {
    flex: 1 1 0;
    min-width: 0;
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    line-height: 1.2;
    letter-spacing: -0.3px;
    margin: 0;
  }
  .bio-rich-btn-immersive-arrow {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    color: #fff;
    transition: transform 180ms ease-out;
  }
  @media (hover: hover) {
    .bio-rich-btn--immersive:hover .bio-rich-btn-immersive-img {
      transform: scale(1.04);
    }
    .bio-rich-btn--immersive:hover .bio-rich-btn-immersive-arrow {
      transform: translateX(3px);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .bio-rich-btn-immersive-img,
    .bio-rich-btn-immersive-arrow { transition: none; }
    .bio-rich-btn--immersive:hover .bio-rich-btn-immersive-img,
    .bio-rich-btn--immersive:hover .bio-rich-btn-immersive-arrow { transform: none; }
  }

  /* Info row — secondary info (bg 0.06, radius 16). Same padding & radius
     as button so all block cards share the same corner treatment. */
  .bio-info-row {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 48px;
    padding: 16px 20px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.08);
    font-size: 16px;
    font-weight: 400;
    line-height: 1;
  }
  .bio-info-row svg { width: 16px; height: 16px; opacity: 0.75; color: #fff; flex-shrink: 0; }
  .bio-info-label { flex: 1; color: rgba(255, 255, 255, 0.88); }
  .bio-info-status {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.60);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .bio-info-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #4ade80;
  }

  /* Map card — visual info block (Figma 14169:13147).
     Single rich-button: embedded map on top (320:120 aspect), icon + address
     row beneath. bg 0.06, radius 16, no border. Iframe darkened via CSS
     filter — Google Maps Embed API has no dark-mode param, this is the
     standard zero-API-key approach. */
  .bio-info-map {
    display: flex;
    flex-direction: column;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.06);
    overflow: hidden;
  }
  .bio-info-map-embed {
    width: 100%;
    aspect-ratio: 320 / 120;
    border: 0;
    display: block;
    background: #1b1e24;
    position: relative;
  }
  .bio-info-map-embed iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
  .bio-info-map-footer {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px;
    min-height: 48px;
    font-size: 14px;
  }
  .bio-info-map-footer svg { width: 18px; height: 18px; color: #fff; flex-shrink: 0; }
  .bio-info-map-footer .bio-info-label { flex: 1; color: #fff; line-height: 1.3; }

  /* ── Zone E — Social icons (Figma 13503:15600-15607) ──
     wrapper: pb 15.333 → 24, pt 0, px 12.778 → 20
     inner: gap 10.222 → 16
     icon container: w 25.556 → 40, p 7.227 → 11
     icon svg: size 11.563 → 18 */
  .bio-socials {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    padding: 0 20px 24px;
  }
  .bio-social-dot {
    width: 40px;
    height: 40px;
    padding: 11px;
    border-radius: 0;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    box-sizing: border-box;
  }
  .bio-social-dot svg { width: 18px; height: 18px; }

  /* ── Zone F — Legal (Figma 2LVaYKcy 8156:4926-4933) ──
     With pill promo above, legal uses tighter top-padding (pt 32 in Figma).
     wrapper pb 16, px 12
     inner: gap 12, pb 20, pt 32, px 20
     font 12, DM Sans / Faculty Glyphic fallback, underline. */
  .bio-legal {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 12px;
    padding: 32px 20px 20px;
    margin: 0 12px 16px;
    font-family: 'Faculty Glyphic', 'Familjen Grotesk', -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    color: #fff;
    white-space: nowrap;
  }
  .bio-legal a { color: #fff; text-decoration: underline; text-underline-offset: 2px; }

  /* ── Withdraw contract (below legal) ── */
  .bio-withdraw-section {
    display: flex;
    justify-content: center;
    padding: 0 20px 32px;
  }
  .bio-withdraw-btn {
    font-family: 'Faculty Glyphic', 'Familjen Grotesk', -apple-system, sans-serif;
    font-size: 14px;
    font-weight: 400;
    line-height: 1.5;
    color: #fff;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.35);
    border-radius: 100px;
    padding: 6px 20px;
    cursor: pointer;
  }

  /* ── Jimdo promo pill (Figma 2LVaYKcy / 8156:4998-5001) ──
     Replaces the full-width blue banner with a centered pill CTA.
     Positioned ABOVE the legal links.
     Wrapper: pt 56, px 16, w-full. Pill: bg #eff0ff, border 1px #b4c4ff,
     radius 100, px 16 py 6, gap 8, font 14 weight 500 color #001453,
     letter-spacing 0.14, J-icon 24×24 radius 2. */
  .bio-jimdo-promo-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 56px 16px 0;
    width: 100%;
    box-sizing: border-box;
  }
  /* ── Virality banner ──
     Made with · the Jimdo wordmark · one way in. The mark sits at half
     opacity and the invitation carries the weight: on someone else's page
     the brand is a credit, not an advert. Figma 11420:28538. */
  .bio-jimdo-promo-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 20px 16px 40px;
  }
  .bio-jimdo-made {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .bio-jimdo-made-label {
    font-size: 12px;
    font-weight: 500;
    line-height: 1.57;
    letter-spacing: 0.12px;
    color: rgba(255, 255, 255, 0.6);
  }
  .bio-jimdo-mark {
    width: 77px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.5;
  }
  .bio-jimdo-word { width: 57.79px; height: 21.05px; display: block; }
  .bio-jimdo-word path { fill: #fff; }

  .bio-jimdo-promo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 10px 24px;
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 100px;
    font-size: 14px;
    font-weight: 500;
    line-height: 1.57;
    letter-spacing: 0.14px;
    color: #fff;
    white-space: nowrap;
    text-decoration: none;
    cursor: pointer;
  }
  .bio-jimdo-promo-icon {
    width: 24px;
    height: 24px;
    border-radius: 2px;
    background: #001453;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: #fff;
  }
  .bio-jimdo-promo-icon svg { width: 14px; height: 14px; }

  /* ══════════════════════════════════════════════════════════════════════
     Interaction states
     Every tappable surface gets a baseline transition, a hover state
     (pointer devices only), a press-down scale on :active, and a
     keyboard focus ring. Micro-interactions are scoped to moments where
     motion carries meaning — arrows nudging forward, socials lifting —
     not applied everywhere as decoration.
     ══════════════════════════════════════════════════════════════════════ */

  .bio-hero-share,
  .bio-contact-btn,
  .bio-link-btn,
  .bio-rich-btn,
  .bio-info-row,
  .bio-info-map,
  .bio-social-dot,
  .bio-jimdo-promo,
  .bio-withdraw-btn {
    cursor: pointer;
    transition: background-color 180ms ease-out,
                border-color 180ms ease-out,
                color 180ms ease-out,
                transform 150ms ease-out;
  }

  /* Rich-button halves animate bg in sync so the card reads as one unit */
  .bio-rich-btn-info,
  .bio-rich-btn-cta {
    transition: background-color 180ms ease-out;
  }

  /* Arrow transitions only the nudge, separate from the container's bg */
  .bio-link-arrow,
  .bio-rich-btn-cta-arrow {
    transition: transform 180ms ease-out;
  }

  /* Keyboard focus — visible ring for all interactive surfaces */
  .bio-hero-share:focus-visible,
  .bio-contact-btn:focus-visible,
  .bio-link-btn:focus-visible,
  .bio-rich-btn:focus-visible,
  .bio-info-row:focus-visible,
  .bio-info-map:focus-visible,
  .bio-social-dot:focus-visible,
  .bio-jimdo-promo:focus-visible,
  .bio-withdraw-btn:focus-visible {
    outline: 2px solid rgba(255, 255, 255, 0.55);
    outline-offset: 3px;
  }

  /* Hover — scoped to pointer devices so touch doesn't get stuck states */
  @media (hover: hover) {
    .bio-hero-share:hover {
      background: rgba(255, 255, 255, 0.22);
    }
    .bio-contact-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.22);
    }
    .bio-link-btn:hover {
      background: rgba(255, 255, 255, 0.20);
    }
    .bio-rich-btn:hover .bio-rich-btn-info,
    .bio-rich-btn:hover .bio-rich-btn-cta {
      background: rgba(255, 255, 255, 0.20);
    }
    .bio-info-row:hover,
    .bio-info-map:hover {
      background: rgba(255, 255, 255, 0.10);
    }
    .bio-social-dot:hover {
      transform: translateY(-2px);
      color: rgba(255, 255, 255, 0.95);
    }
    .bio-jimdo-promo:hover {
      background: #f5f7ff;
    }
    .bio-withdraw-btn:hover {
      border-color: rgba(255, 255, 255, 0.6);
      background: rgba(255, 255, 255, 0.06);
    }

    /* Arrow forward affordance — small nudge signals "go" */
    .bio-link-btn:hover .bio-link-arrow,
    .bio-rich-btn:hover .bio-rich-btn-cta-arrow {
      transform: translateX(3px);
    }
  }

  /* Active (press) — snappy scale-down feedback on every device */
  .bio-hero-share:active,
  .bio-contact-btn:active,
  .bio-link-btn:active,
  .bio-rich-btn:active,
  .bio-info-row:active,
  .bio-info-map:active,
  .bio-social-dot:active,
  .bio-jimdo-promo:active,
  .bio-withdraw-btn:active {
    transform: scale(0.97);
    transition-duration: 80ms;
  }

  /* ══════════════════════════════════════════════════════════════════════
     Desktop presentation
     On wider viewports the page is presented as a 360-wide card sitting
     on a slightly lighter body canvas, with generous vertical breathing
     room so it doesn't touch the browser edges. Rounded corners + a soft
     drop shadow lift the card off the canvas. Mobile layout is untouched.
     ══════════════════════════════════════════════════════════════════════ */
  @media (min-width: 768px) {
    body {
      background: #1a1a1a;
      padding: 40px 0;
    }
    .bio-page {
      min-height: auto;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
  }

  /* Respect users who prefer reduced motion — strip all transitions */
  @media (prefers-reduced-motion: reduce) {
    .bio-hero-share,
    .bio-contact-btn,
    .bio-link-btn,
    .bio-rich-btn,
    .bio-rich-btn-info,
    .bio-rich-btn-cta,
    .bio-pending,
    .bio-pending-pill,
    .bio-info-row,
    .bio-info-map,
    .bio-social-dot,
    .bio-jimdo-promo,
    .bio-withdraw-btn,
    .bio-link-arrow,
    .bio-rich-btn-cta-arrow {
      transition: none;
    }
    .bio-hero-share:active,
    .bio-contact-btn:active,
    .bio-link-btn:active,
    .bio-rich-btn:active,
    .bio-info-row:active,
    .bio-info-map:active,
    .bio-social-dot:active,
    .bio-jimdo-promo:active,
    .bio-withdraw-btn:active,
    .bio-social-dot:hover,
    .bio-link-btn:hover .bio-link-arrow,
    .bio-rich-btn:hover .bio-rich-btn-cta-arrow {
      transform: none;
    }
  }

  /* ─── One placeholder fill, declared last ───
     Every block that can be ghosted carries its own background — the link
     button at 0.15, the map at 0.06, the contact pill at 0.10 — and each of
     those is declared further down this sheet than the ghost rules were, so
     they were quietly winning on source order and the placeholders came out
     three different shades. Restating the fill here, after all of them and
     scoped one level deeper, settles it for the blocks that exist now and
     for any added later. A ghost is a ghost: one fill, no hierarchy among
     things that are not there yet. */
  .bio-page .bio-ghost-text,
  .bio-page .bio-socials.bio-ghost .bio-social-dot,
  /* The socials row carries .bio-ghost to ghost the dots inside it, but it is
     a container of ghosts, not one itself — filling it too drew a slab behind
     the row. Everything else wearing .bio-ghost IS the placeholder. */
  .bio-page .bio-ghost:not(.bio-socials),
  .bio-page .bio-contact-ghost,
  .bio-page .bio-hero-img-wrap,
  .bio-page .bio-rich-btn-img-placeholder {
    background: var(--bio-ghost-fill);
    border-color: transparent;
  }

</style>
</head>

<!-- ─── Live-config bridge ───────────────────────────────────────────────
     Lets a host (e.g. the onboarding "Pick ways for customers to find you"
     editor) drive this bio page as a live preview. Additive + backwards
     compatible: with no message, chips stay hidden and the map stays as
     authored. Items are shown only once turned on — nothing fake is rendered
     ahead of time. Contract:
       { type:'bio-config',
         actions:[{id:'booking'|'whatsapp'|'email'|'call', on:bool, label?:string}],
         address:{ on:bool, value?:string },
         links:'none'|'default'|[{id?,label,pending?}],  // an array rebuilds
                                       // the button list in the order given;
                                       // each gets id bio-link-<id> so a host
                                       // can highlight one of them
         footer:'hidden'|'default',    // footer:'hidden' hides socials, Jimdo
                                       // promo, legal + withdraw sections
         title:string,                 // business name shown in the hero
         subtitle:string,              // line under the hero
         image:'photo'|'placeholder',  // real photo, or the empty silhouette
         offer:{ on:bool, kind:'book'|'pay'|'promo', title?, meta?, cta?,
                 price? },             // the action-page card
         mainlink:string,              // label on the main link button
         ghost:['contact'|'mainlink'|'map'|'socials'|'subtitle'],  // empty shapes
         highlight:'title'|'image'|'offer'|'contact-buttons'|'mainlink'|'map'
                                       // outline that region and scroll to it,
                                       // null clears and returns to the top -->

<script>
  (function () {
    'use strict';
    var lastHighlight = null;
    function applyConfig(d) {
      if (!d || d.type !== 'bio-config') return;
      // `contact` is the current name; `actions` is the old one and still
      // accepted so the screens can move over one at a time.
      var contact = Array.isArray(d.contact) ? d.contact : d.actions;
      if (Array.isArray(contact)) {
        var on = {};
        contact.forEach(function (a) { if (a.on) on[a.id] = a; });
        document.querySelectorAll('.bio-contact-btn[data-action]').forEach(function (chip) {
          var a = on[chip.getAttribute('data-action')];
          chip.hidden = !a;                       // shown only once turned on
          if (a && a.label) {
            var lbl = chip.querySelector('.bio-contact-btn-label');
            if (lbl) lbl.textContent = a.label;
          }
        });
        var row = document.getElementById('bio-contact-row');
        if (row) row.hidden = Object.keys(on).length === 0;
      }
      if (d.address) {
        var map = document.getElementById('bio-map');
        if (map) map.hidden = !d.address.on;      // shown only once turned on
        if (d.address.on && d.address.value) {
          var mlbl = document.querySelector('#bio-map .bio-info-map-footer .bio-info-label');
          if (mlbl) mlbl.textContent = d.address.value;
        }
      }
      if (typeof d.title === 'string') {
        var t = document.getElementById('bio-title');
        // Break on the last space so a two-word name stacks the way the
        // authored hero does, instead of wrapping arbitrarily.
        if (t) {
          var words = d.title.trim().split(/\s+/);
          t.innerHTML = '';
          if (words.length > 1) {
            t.appendChild(document.createTextNode(words.slice(0, -1).join(' ')));
            t.appendChild(document.createElement('br'));
            t.appendChild(document.createTextNode(words[words.length - 1]));
          } else {
            t.textContent = words[0] || '';
          }
        }
      }
      if (typeof d.subtitle === 'string') {
        var st = document.getElementById('bio-subtitle');
        if (st) st.textContent = d.subtitle;
      }
      if (d.image) {
        var img = document.querySelector('.bio-hero-img');
        var ph = document.getElementById('bio-image-placeholder');
        var wantsPhoto = d.image === 'photo';
        if (img) img.hidden = !wantsPhoto;
        if (ph) ph.hidden = wantsPhoto;
      }
      if (d.offer) {
        var offer = document.getElementById('bio-offer');
        if (offer) {
          offer.hidden = !d.offer.on;
          var kind = d.offer.kind || 'book';
          var set = function (id, value, fallbackHide) {
            var el = document.getElementById(id);
            if (!el) return;
            if (typeof value === 'string') el.textContent = value;
            el.hidden = fallbackHide || (typeof value === 'string' && !value);
          };
          set('bio-offer-title', d.offer.title);
          set('bio-offer-meta', d.offer.meta);
          set('bio-offer-cta', d.offer.cta);
          set('bio-offer-price', d.offer.price);
          // Only a date-bound offer earns the calendar icon; the others
          // would be claiming a schedule they do not have.
          var icon = document.getElementById('bio-offer-icon');
          if (icon) icon.style.display = kind === 'book' ? '' : 'none';
          // Chosen but not set up: shown, dimmed, and marked — see .bio-pending.
          if ('pending' in d.offer) {
            offer.setAttribute('data-pending', d.offer.pending ? 'true' : 'false');
          }
        }
        // One offer at a time while it is being chosen — a second button
        // beside it would read as something already added.
        document.querySelectorAll('#bio-links [data-link]').forEach(function (b) {
          b.hidden = d.offer.on;
        });
      }
      if (typeof d.mainlink === 'string') {
        var ml = document.getElementById('bio-mainlink');
        var mlSpan = ml ? ml.querySelector('span') : null;
        if (mlSpan && d.mainlink) mlSpan.textContent = d.mainlink;
      }
      if (Array.isArray(d.links)) {
        // The host drives the whole button list. A button is cloned from the
        // one authored here rather than built from a string, so the arrow and
        // its markup stay this file's business.
        var group = document.getElementById('bio-links');
        var proto = group && group.querySelector('.bio-link-btn');
        if (group && proto) {
          var model = proto.cloneNode(true);
          group.innerHTML = '';
          d.links.forEach(function (l) {
            var btn = model.cloneNode(true);
            btn.hidden = false;
            btn.className = 'bio-link-btn bio-edit-target';
            btn.setAttribute('data-link', 'real');
            if (l.id) btn.id = 'bio-link-' + l.id;
            else btn.removeAttribute('id');
            if (l.pending) btn.setAttribute('data-pending', 'true');
            else btn.removeAttribute('data-pending');
            var span = btn.querySelector('span');
            if (span) span.textContent = l.label || '';
            group.appendChild(btn);
          });
          group.hidden = d.links.length === 0;
        }
      } else if (d.links === 'none' || d.links === 'default') {
        // Both directions, so a host that turns the links off can turn them
        // back on; before this only the hiding half existed.
        var hide = d.links === 'none';
        // 'none' takes the demo page's spare link with it; 'default' brings
        // back only the one the host configures. A page being built has one
        // main button, not two, and the spare is furniture for the artifact
        // when it is opened on its own.
        document.querySelectorAll('#bio-links [data-link="extra"]').forEach(function (b) { b.hidden = true; });
        document.querySelectorAll('#bio-links [data-link="real"]').forEach(function (b) { b.hidden = hide; });
      }
      if (Array.isArray(d.ghost)) {
        var wants = {};
        d.ghost.forEach(function (g) { wants[g] = true; });

        // Two empty pills stand in for the contact row until there is a real
        // one. Once any real button exists the ghosts go, rather than padding
        // the row out to a fixed length.
        var hasReal = document.querySelectorAll('.bio-contact-btn[data-action]:not([hidden])').length > 0;
        document.querySelectorAll('[data-ghost-slot]').forEach(function (el) {
          el.hidden = !wants.contact || hasReal;
        });
        var row = document.getElementById('bio-contact-row');
        if (row && wants.contact && !hasReal) row.hidden = false;

        [['mainlink', 'bio-mainlink', 'bio-ghost'],
         ['map', 'bio-map', 'bio-ghost'],
         ['socials', 'bio-socials', 'bio-ghost'],
         ['subtitle', 'bio-subtitle', 'bio-ghost-text']].forEach(function (r) {
          var el = document.getElementById(r[1]);
          if (!el) return;
          var ghost = !!wants[r[0]];
          el.classList.toggle(r[2], ghost);
          if (ghost && r[2] === 'bio-ghost') el.hidden = false;
        });
      }
      // Last, on purpose: everything above rebuilds or hides parts of the
      // page, and a mark applied before that is a mark on a node that is
      // about to be replaced. The link list is rebuilt from scratch on every
      // config, which is exactly where this went wrong.
      if ('highlight' in d) {
        document.querySelectorAll('.bio-edit-target').forEach(function (el) {
          el.classList.remove('is-highlighted');
        });
        var target = d.highlight ? document.getElementById('bio-' + d.highlight) : null;
        if (target) target.classList.add('is-highlighted');

        // Bring the region being edited into the frame. Only when it changes:
        // the host pushes a config on every keystroke, and re-scrolling on
        // each one would fight the person typing.
        if (d.highlight !== lastHighlight) {
          lastHighlight = d.highlight || null;
          if (target && !target.hidden) {
            var top = target.getBoundingClientRect().top + window.scrollY;
            var y = top - Math.max(0, (window.innerHeight - target.offsetHeight) / 2);
            // scrollTo rather than scrollIntoView: the latter also scrolls the
            // document this page is framed inside.
            window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
          } else if (!target) {
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }
        }
      }
      if (d.footer === 'hidden') {
        ['.bio-socials', '.bio-jimdo-promo-wrap', '.bio-legal', '.bio-withdraw-section']
          .forEach(function (sel) { var el = document.querySelector(sel); if (el) el.hidden = true; });
      }
    }
    window.addEventListener('message', function (e) { applyConfig(e.data); });
    // Announce readiness so the host can push the initial config.
    try { if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'bio-ready' }, '*'); } catch (_) {}
  })();
</script>
