<!-- Baseline tokens (synced from @jimdo/ui) load LAST so upstream wins for
     every redeclared --jui-*. See kb/design-analysis/2026-05-11_jui-token-divergence-decisions.md
     for the 5 truly-divergent tokens we deliberately accepted from upstream. -->
<link rel="stylesheet" href="/flows-prototype/design-system/dist/baseline/jui-tokens.css?v=088d811">
<style>
  /* ─── Page shell ───
     Breaks out of the standard header/body/footer anatomy.
     Two cards sit side-by-side inside a gray canvas with 12px padding.
     Each card is independently rounded; the right card carries its own
     internal footer with a fade-to-white gradient. */
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--jui-color-gray-50, #f8f8f8);
    color: var(--jui-color-typography-gray-on-light-default, #000);
  }

  .play-shell {
    display: flex;
    height: 100vh;
    padding: 12px;
    gap: 8px;
    box-sizing: border-box;
  }

  /* ─── Left: decorative blue card ─── */
  .play-deco {
    position: relative;
    width: 360px;
    flex-shrink: 0;
    background: var(--jui-color-blue-400);
    border-radius: 20px;
    border: 1px solid var(--jui-color-gray-50, #f8f8f8);
    box-shadow: 0 4px 24px 0 rgba(0, 0, 0, 0.02);
    padding: 32px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
    box-sizing: border-box;
  }

  /* Pattern Studio decoration host.
     pattern-loader.js renders an absolutely-positioned <svg> into this element;
     in-flow siblings get position: relative + z-index: 1 so they sit above
     the pattern. */
  .play-deco > .play-deco-pattern {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
    border-radius: inherit;
  }
  .play-deco > *:not(.play-deco-pattern) { position: relative; z-index: 1; }

  /* Jimdo wordmark — uses the real Jimdo logo SVG (matches `.jimdo-logo--wordmark`
     from sibling hifi pages). Sized to ~64px wide as per Figma. */
  .play-jimdo-wordmark {
    width: 64px;
    height: auto;
    color: var(--jui-color-gray-white, #fff);
    flex-shrink: 0;
  }
  .play-jimdo-wordmark svg { display: block; width: 100%; height: auto; }

  /* Glassmorphism testimonial card */
  .play-testimonial {
    backdrop-filter: blur(26px);
    -webkit-backdrop-filter: blur(26px);
    background: rgba(20, 20, 20, 0.16);
    border: 1px solid rgba(255, 255, 255, 0.26);
    border-radius: 12px;
    padding: 24px;
    color: var(--jui-color-gray-white, #fff);
    box-shadow: 0 4px 24px 0 rgba(0, 0, 0, 0.12);
    text-shadow: 0 0 24px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .play-testimonial-quote {
    margin: 0;
    font-style: italic;
    font-weight: 500;
    font-size: 16px;
    line-height: 1.25;
  }
  .play-testimonial-attribution {
    margin: 0;
    font-size: 14px;
    line-height: 1.57;
  }

  /* ─── Right: form card ─── */
  .play-form-card {
    flex: 1 1 0;
    min-width: 0;
    background: var(--jui-color-gray-white, #fff);
    border-radius: 20px;
    border: 1px solid var(--jui-color-gray-50, #f8f8f8);
    box-shadow: 0 4px 24px 0 rgba(0, 0, 0, 0.02);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-sizing: border-box;
    position: relative;
  }

  .play-form-content {
    padding: 32px 32px 0;
    display: flex;
    flex-direction: column;
    gap: 40px;
    flex: 1 1 auto;
    min-height: 0;
  }

  /* Progress bar — 4 segments, 2px tall, 128px wide */
  .play-progress {
    display: flex;
    gap: 4px;
    width: 128px;
    height: 8px;
    align-items: center;
    padding: 2px 0;
  }
  .play-progress-step {
    flex: 1 0 0;
    height: 2px;
    border-radius: 12px;
    background: var(--jui-color-blue-50);
  }
  .play-progress-step.active {
    background: var(--jui-color-blue-500);
  }

  .play-form-body {
    display: flex;
    flex-direction: column;
    gap: 32px;
  }

  .play-intro {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .play-intro h1 {
    margin: 0;
    font-size: var(--jui-typography-sub-headline-large-size, 24px);
    line-height: var(--jui-typography-sub-headline-large-lh, 1.33);
    font-weight: 500;
    color: var(--jui-color-typography-gray-on-light-default, #000);
  }
  .play-intro p {
    margin: 0;
    font-size: 14px;
    line-height: 1.57;
    color: var(--jui-color-typography-gray-on-light-default, #000);
  }

  .play-input-group {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .play-input-group .form-input {
    width: 360px;
    max-width: 100%;
  }
  .play-input-helper {
    margin: 0;
    font-size: 14px;
    line-height: 1.57;
    color: var(--jui-color-typography-gray-on-light-subdued, #6d6d6d);
  }

  /* Right-card internal footer — gradient fade + actions */
  .play-form-footer {
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(to top, var(--jui-color-gray-white, #fff) 40%, rgba(255, 255, 255, 0));
    flex-shrink: 0;
    margin-top: auto;
    min-height: 80px;
    box-sizing: border-box;
  }
  .play-form-footer .btn-primary {
    width: auto;
    padding: 12px 24px;
  }

  /* ─── Mobile fallback ─── */
  @media (max-width: 767px) {
    .play-shell {
      flex-direction: column;
      height: auto;
      min-height: 100vh;
    }
    .play-deco {
      width: 100%;
      min-height: 280px;
    }
    .play-input-group .form-input { width: 100%; }
  }

</style>

  <!-- Pattern Studio loader — auto-renders any [data-pattern] element on the page. -->
  <script type="module" src="/flows-prototype/design-system/pattern-studio/pattern-loader.js?v=088d811"></script>

  <script>
    var VARIANTS = {
      'empty': 'variant-empty',
      'filled': 'variant-filled'
    };
    function showVariant(key) {
      document.querySelectorAll('.variant').forEach(function(v) { v.classList.remove('active'); });
      var target = document.getElementById(VARIANTS[key]);
      if (target) target.classList.add('active');
    }

    // Apply a pattern config to every decoration host on the page.
    // The workbench right panel sends `set-pattern` messages whenever the
    // editor controls change; the pattern-loader's MutationObserver picks up
    // the new data-pattern attribute and re-renders in place.
    function applyPatternConfig(config) {
      if (!config || typeof config !== 'object') return;
      var json = JSON.stringify(config);
      document.querySelectorAll('.play-deco-pattern').forEach(function(el) {
        el.setAttribute('data-pattern', json);
      });
    }

    window.addEventListener('message', function(e) {
      var data = e.data;
      if (!data || typeof data !== 'object') return;
      if (data.type === 'set-variant' && VARIANTS[data.variant]) {
        showVariant(data.variant);
      } else if (data.type === 'set-pattern' && data.config) {
        applyPatternConfig(data.config);
      }
    });
  </script>
