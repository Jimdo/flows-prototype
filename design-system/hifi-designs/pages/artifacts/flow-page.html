<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=360, initial-scale=1">
<title>Clara and Stone — Free Trial Session</title>
<style>
  /* ═══════════════════════════════════════════════
     ARTIFACT — DARK FLOW/PROMOTION PAGE
     Single-offer landing page linked from bio-page.
     Native mobile width: 360px. No iPhone chrome —
     the workbench iframe holder supplies it.
     Figma: 13503:18324 (01. Flows — Explorations)
     ═══════════════════════════════════════════════ */

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #0a0a0a;
    -webkit-font-smoothing: antialiased;
  }

  body {
    font-family: 'Familjen Grotesk', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    color: #fff;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .flow-page {
    width: 100%;
    max-width: 360px;
    min-height: 100vh;
    margin: 0 auto;
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* ── Header bar (Figma 13697:81864) ──
     py 12 px 20, flex space-between center.
     Brand = Familjen Grotesk SemiBold 14 uppercase white.
     Share = 32×32 rounded 8, bg matches bio-page primary buttons
     (rgba(255,255,255,0.15)). */
  .fp-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    width: 100%;
  }
  .fp-brand {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.3;
    color: #fff;
    letter-spacing: 0;
    text-transform: uppercase;
  }
  .fp-share {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.15);
    border: 0;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    cursor: pointer;
    flex-shrink: 0;
  }
  .fp-share svg { width: 18px; height: 18px; stroke-width: 1.5; }

  /* ── Hero image (Figma 13503:18328-18330) ──
     Image container has 8px side padding on black so the
     18px-radius image sits with breathing room. Image is
     full-width × 344px in the 360 native frame. */
  .fp-hero {
    padding: 0 8px;
    width: 100%;
  }
  .fp-hero-img-wrap {
    width: 100%;
    height: 344px;
    border-radius: 18px;
    overflow: hidden;
    background: #1a1015;
    position: relative;
  }
  .fp-hero-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 30%;
  }

  /* ── Content block (Figma 13503:18331-18336) ──
     Title block p 20. Description + bullets pb 24 px 20.
     All text is Familjen Grotesk white. No gap between blocks —
     each block has its own internal padding, like Figma. */
  .fp-title {
    margin: 0;
    padding: 20px;
    font-size: 25px;
    font-weight: 600;
    line-height: 1.3;
    color: #fff;
    letter-spacing: 0;
  }
  .fp-desc {
    margin: 0;
    padding: 0 20px 24px;
    font-size: 16px;
    font-weight: 400;
    line-height: 1.5;
    color: #fff;
    white-space: pre-wrap;
  }
  .fp-list {
    margin: 0;
    padding: 0 20px 24px;
    font-size: 16px;
    font-weight: 400;
    line-height: 1.5;
    color: #fff;
    list-style: none;
  }
  .fp-list li::before {
    content: '- ';
  }

  /* ── Jimdo promo pill ──
     Mirrors bio-page.html pattern. Wrapper: pt 56 px 16 w-full (the 56px
     top padding replaces the explicit content→legal spacer). Pill: bg
     #eff0ff, border 1px #b4c4ff, radius 100, px 16 py 6, gap 8,
     font 14 weight 500 color #001453, letter-spacing 0.14,
     J-icon 24×24 radius 2. */
  /* ── Virality banner ──
     Made with · the Jimdo wordmark · one way in. Same block as the bio page
     so a visitor meets one invitation, not two different ones depending on
     which page they landed on. The action page keeps its larger top gap, as
     the banner follows a form rather than a list. Figma 11420:28538. */
  .fp-jimdo-promo-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 56px 16px 40px;
    width: 100%;
    box-sizing: border-box;
  }
  .fp-jimdo-made {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .fp-jimdo-made-label {
    font-size: 12px;
    font-weight: 500;
    line-height: 1.57;
    letter-spacing: 0.12px;
    color: rgba(255, 255, 255, 0.6);
  }
  .fp-jimdo-mark {
    width: 77px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.5;
  }
  .fp-jimdo-word { width: 57.79px; height: 21.05px; display: block; }
  .fp-jimdo-word path { fill: #fff; }

  .fp-jimdo-promo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 10px 24px;
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 100px;
    font-size: 14px;
    font-weight: 500;
    line-height: 1.57;
    letter-spacing: 0.14px;
    color: #fff;
    white-space: nowrap;
    text-decoration: none;
    cursor: pointer;
  }

  /* ── Legal (Figma 13503:18338-18341) ──
     Gap 16, items-start justify-center, pt 32 (matches bio-page
     promo→legal rhythm) pb 20 px 20. Font DM Sans 14 (with
     Faculty Glyphic fallback to match bio-page convention),
     underlined, white. */
  .fp-legal {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 16px;
    padding: 32px 20px 20px;
    font-family: 'DM Sans', 'Faculty Glyphic', 'Familjen Grotesk', -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    color: #fff;
    white-space: nowrap;
  }
  .fp-legal a {
    color: #fff;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  /* ── Withdraw contract (below legal) ── */
  .fp-withdraw-section {
    display: flex;
    justify-content: center;
    padding: 0 20px 32px;
  }
  .fp-withdraw-btn {
    font-family: 'DM Sans', 'Faculty Glyphic', 'Familjen Grotesk', -apple-system, sans-serif;
    font-size: 14px;
    font-weight: 400;
    line-height: 1.5;
    color: #fff;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.35);
    border-radius: 100px;
    padding: 6px 20px;
    cursor: pointer;
    transition: background-color 180ms ease-out,
                border-color 180ms ease-out,
                transform 150ms ease-out;
  }
  .fp-withdraw-btn:focus-visible {
    outline: 2px solid rgba(255, 255, 255, 0.55);
    outline-offset: 3px;
  }
  @media (hover: hover) {
    .fp-withdraw-btn:hover {
      border-color: rgba(255, 255, 255, 0.6);
      background: rgba(255, 255, 255, 0.06);
    }
  }
  .fp-withdraw-btn:active {
    transform: scale(0.97);
    transition-duration: 80ms;
  }
  @media (prefers-reduced-motion: reduce) {
    .fp-withdraw-btn { transition: none; }
    .fp-withdraw-btn:active { transform: none; }
  }

  .fp-scroll-pad {
    display: none;
  }

  /* ── Fixed CTA (Figma 13503:18343-18344) ──
     Sticky bottom bar, solid black with a soft top shadow +
     hairline top border so the CTA sits above scrolling content.
     Button: off-white (#fdfdfd), radius 16, p 16, SemiBold 20 black.
     Matches Figma exact values. */
  .fp-fixed-cta {
    position: sticky;
    bottom: 0;
    width: 100%;
    padding: 20px;
    background: #0a0a0a;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 -2px 17px rgba(0, 0, 0, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .fp-cta {
    width: 100%;
    min-height: 44px;
    padding: 12px;
    border: 0;
    border-radius: 16px;
    background: #fdfdfd;
    color: #000;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.3;
    text-align: center;
    cursor: pointer;
  }

  /* ══════════════════════════════════════════════════════════════════════
     Desktop presentation
     On wider viewports the page is presented as a 360-wide card sitting
     on a slightly lighter body canvas, with generous vertical breathing
     room so it doesn't touch the browser edges. Rounded corners + a soft
     drop shadow lift the card off the canvas.
     The sticky CTA gets bottom border-radius to match the card corners.
     ══════════════════════════════════════════════════════════════════════ */
  @media (min-width: 768px) {
    body {
      background: #1a1a1a;
      padding: 40px 0;
    }
    .flow-page {
      min-height: auto;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    .fp-fixed-cta {
      border-radius: 0 0 20px 20px;
    }
  }
</style>
</head>
<body>

<div class="flow-page">

  <!-- Zone A — Header -->
  <header class="fp-header">
    <div class="fp-brand">CLARA AND STONE</div>
    <button class="fp-share" aria-label="Share">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
        <polyline points="16 6 12 2 8 6"/>
        <line x1="12" y1="2" x2="12" y2="15"/>
      </svg>
    </button>
  </header>

  <!-- Zone B — Hero -->
  <div class="fp-hero">
    <div class="fp-hero-img-wrap" role="img" aria-label="Clara and Stone portrait">
      <img class="fp-hero-img"
           alt=""
           src="../images/clara-stone.jpg"
           aria-hidden="true" />
    </div>
  </div>

  <!-- Zone C — Content -->
  <h1 class="fp-title">Free trial session</h1>
  <p class="fp-desc">Perfect for beginners, design custom jewelry. Materials are included</p>
  <ul class="fp-list">
    <li>Create personalized sets</li>
    <li>Pro tips and tricks</li>
    <li>Cherish your new gems</li>
  </ul>

  <!-- Jimdo promo pill — sits above the legal links -->
  <div class="fp-jimdo-promo-wrap">
    <span class="fp-jimdo-made">
      <span class="fp-jimdo-made-label">Made with</span>
      <span class="fp-jimdo-mark" aria-hidden="true"><svg class="fp-jimdo-word" viewBox="0 0 57.7945 21.0545" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Jimdo"><g id="Type=No Claim, Color=Navy">

<path id="Vector_3" d="M13.2483 5.87771H10.8933V11.4971C10.8933 12.3929 10.1561 13.1194 9.24711 13.1194C8.33808 13.1194 7.60088 12.3929 7.60088 11.4971H5.24596C5.24596 13.6747 7.03731 15.44 9.24711 15.44C11.4569 15.44 13.2483 13.6747 13.2483 11.4971V5.87771Z" fill="white"/>
<path id="Vector_4" d="M36.6785 5.87771H33.1651V15.2645H36.6785C39.3051 15.2645 41.4342 13.1633 41.4342 10.5711C41.4342 7.97893 39.3051 5.87771 36.6785 5.87771ZM36.3929 13.3059H35.5026V7.83454H36.3929C37.9235 7.83454 39.165 9.05886 39.165 10.5702C39.165 12.0816 37.9244 13.3059 36.3929 13.3059Z" fill="white"/>
<path id="Vector_5" d="M17.9607 5.87771H15.56V15.1768H17.9607V5.87771Z" fill="white"/>
<path id="Vector_6" d="M56.3708 1.4027V19.6518H1.42362V1.4027H56.3708ZM57.7945 0H0V21.0545H57.7945V0Z" fill="white"/>
</g></svg></span>
    </span>
    <a class="fp-jimdo-promo" href="#">Build your own page for free</a>
  </div>

  <!-- Zone D — Legal -->
  <nav class="fp-legal" aria-label="Legal">
    <a href="#">Imprint</a>
    <a href="#">Cookie Settings</a>
    <a href="#">Privacy Policy</a>
  </nav>

  <!-- Zone D2 — Withdraw contract -->
  <div class="fp-withdraw-section">
    <button class="fp-withdraw-btn">Withdraw contract</button>
  </div>

  <!-- Scroll buffer so last content clears the fixed CTA -->
  <div class="fp-scroll-pad"></div>

  <!-- Zone E — Fixed CTA -->
  <div class="fp-fixed-cta">
    <button class="fp-cta">Book Your Free Trial</button>
  </div>

</div>

</body>
</html>
